<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나만의 비바리움</title>
<meta name="description" content="유리통을 고르고 흙·물·빛을 채운 뒤 생산자·소비자·분해자를 넣어 나만의 3D 생태계를 만들고, 먹이 그물과 30일 변화를 관찰하는 초등 과학 웹앱">
<meta name="theme-color" content="#FBFDFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17221E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비바리움">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='8' width='44' height='50' rx='10' fill='%23d9eef0' stroke='%232C6A4E' stroke-width='4'/%3E%3Crect x='14' y='40' width='36' height='14' rx='4' fill='%236b4a2e'/%3E%3Cpath d='M32 40c0-10 6-16 14-18-2 9-7 14-14 18zM32 40c0-8-5-13-12-15 1 8 6 12 12 15z' fill='%233E8E4A'/%3E%3C/svg%3E">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: 3D 유리통 무대(왼쪽/위) + 단계별 조작 패널(오른쪽/아래). 상단엔 6단계 진행 표시. */
:root{
  --bg:#E9EFEA; --panel:#FBFDFB; --panel2:#F1F5F1; --ink:#1C2A23; --muted:#5B6D63; --line:#D3DDD5;
  --accent:#2C6A4E; --accent-ink:#FFFFFF; --sun:#E0A030; --sunsoft:#FBEFD3;
  --good:#2E8452; --warn:#B07A0E; --bad:#B9443A;
  --c-prod:#3E8E4A; --c-con1:#D08A1E; --c-con2:#C4553F; --c-dec:#7E5C9A; --c-abio:#3F7D9C;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --shadow:0 6px 24px rgba(28,52,40,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111A17; --panel:#17221E; --panel2:#1E2B26; --ink:#E3EDE7; --muted:#97ABA0; --line:#2C3B35;
  --accent:#62B48A; --accent-ink:#0E1A14; --sun:#E8B04A; --sunsoft:#3A2F17;
  --good:#5DBB83; --warn:#E0AE45; --bad:#E77B70;
  --c-prod:#6CC07A; --c-con1:#E6A64A; --c-con2:#E8806A; --c-dec:#B394D0; --c-abio:#6FB0D0;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111A17; --panel:#17221E; --panel2:#1E2B26; --ink:#E3EDE7; --muted:#97ABA0; --line:#2C3B35;
  --accent:#62B48A; --accent-ink:#0E1A14; --sun:#E8B04A; --sunsoft:#3A2F17;
  --good:#5DBB83; --warn:#E0AE45; --bad:#E77B70;
  --c-prod:#6CC07A; --c-con1:#E6A64A; --c-con2:#E8806A; --c-dec:#B394D0; --c-abio:#6FB0D0;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark; }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
#pbody>*{flex:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* top bar */
#topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-width:0}
#brand{font-family:var(--f-display);font-size:20px;color:var(--accent);white-space:nowrap;background:none;border:0;padding:0}
#brand .home{display:none;width:18px;height:18px}
#steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
#steps::-webkit-scrollbar{display:none}
#steps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px 5px 5px;white-space:nowrap;font-size:13px;color:var(--muted)}
#steps .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-weight:700;font-size:12px}
#steps button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#steps button.on .n{background:var(--accent-ink);color:var(--accent)}
#steps button.done .n{background:var(--accent);color:var(--accent-ink)}
#steps button:disabled{opacity:.45;cursor:default}

#main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:linear-gradient(180deg,#9fcde8 0%,#dcecdf 60%,#c4ab84 100%);transition:background 1s}
#stage.evening{background:linear-gradient(180deg,#ee9a5e 0%,#f3c99a 55%,#a9855f 100%)}
#stage.night{background:linear-gradient(180deg,#0d1630 0%,#1b2747 60%,#2b2a35 100%)}
#c{display:block;width:100%;height:100%;touch-action:none}
#stage.placing #c{cursor:crosshair}

#envbadge{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 24px)}
.pill{background:rgba(255,255,255,.82);color:#1C2A23;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.08);font-variant-numeric:tabular-nums}
.pill b{font-weight:700}
#viewctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vbtn{background:rgba(255,255,255,.88);color:#1C2A23;border:0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.vbtn.on{background:#1C2A23;color:#fff}
#hint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:rgba(28,42,35,.86);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#selpop{position:absolute;left:12px;bottom:56px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}
#selpop img{width:40px;height:40px}
#selpop .t{font-weight:700}
#selpop .s{font-size:12px;color:var(--muted)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.9);color:#1C2A23;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;border-bottom:3px solid var(--lc,#888)}

/* panel */
#panel{width:380px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#pbody{flex:1;overflow-y:auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:16px}
#pnav{display:flex;gap:8px;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.danger{color:var(--bad)}

h2.ptitle{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.lead{margin:6px 0 0;color:var(--muted);line-height:1.6}
.concept{background:var(--sunsoft);border-radius:14px;padding:12px 14px;line-height:1.6;font-size:13px}
.concept b{color:var(--ink)}
h3.sec{font-size:13px;margin:0 0 8px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3.sec small{font-weight:500;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{border:1.5px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;position:relative}
.card img{width:100%;max-width:92px;aspect-ratio:1;object-fit:contain}
.card .nm{font-weight:600;font-size:12.5px;line-height:1.25;word-break:keep-all}
.card .sub{font-size:11px;color:var(--muted);line-height:1.3;word-break:keep-all}
.card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel2));box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.card .cnt{position:absolute;top:5px;right:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.swatch{width:100%;max-width:92px;aspect-ratio:1.6;border-radius:9px;background-size:cover;border:1px solid rgba(0,0,0,.08)}
.opt{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:left;min-width:0}
.opt .nm{font-weight:600;font-size:12.5px}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
.opt .swatch{max-width:none;aspect-ratio:2.4}
.desc{font-size:12px;color:var(--muted);line-height:1.55;margin:6px 0 0}

.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 6px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.range{display:flex;flex-direction:column;gap:4px}
.range .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.range .top span:last-child{font-variant-numeric:tabular-nums;color:var(--accent)}
.range input{width:100%;accent-color:var(--accent)}
.range .scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 6px;font-weight:600;font-size:12.5px;min-width:0}
.seg.wrap button{flex:1 1 30%;white-space:nowrap}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gauge div{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.gauge b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.gauge span{font-size:11px;color:var(--muted)}

.info{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.info .hd{display:flex;gap:10px;align-items:center}
.info .hd img{width:54px;height:54px;flex:none}
.info .hd b{font-size:15px}
.role{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--rc)}
.need{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:12px;align-items:center}
.need .k{color:var(--muted)}
.need .ok{color:var(--good);font-weight:700}
.need .no{color:var(--bad);font-weight:700}
.need .mid{color:var(--warn);font-weight:700}
.fitbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fitbar i{display:block;height:100%;border-radius:99px}

.placed{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 9px;font-size:12px;background:var(--panel2)}
.chip button{border:0;background:var(--line);border-radius:50%;width:18px;height:18px;line-height:16px;font-size:12px;padding:0}
.empty{font-size:12px;color:var(--muted)}

.fb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fb li{display:grid;grid-template-columns:8px 1fr;gap:10px;font-size:12.5px;line-height:1.5;background:var(--panel2);border-radius:10px;padding:8px 10px}
.fb li::before{content:"";border-radius:4px;background:var(--fc)}
.fb li.good{--fc:var(--good)} .fb li.warn{--fc:var(--warn)} .fb li.bad{--fc:var(--bad)}
.scorebox{display:flex;gap:14px;align-items:center}
.scorebox svg{flex:none}
.scorebox .g{font-family:var(--f-display);font-size:22px}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.counts div{border-radius:10px;padding:7px 4px;text-align:center;background:var(--panel2);border-top:3px solid var(--cc)}
.counts b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.counts span{font-size:10.5px;color:var(--muted)}
.web{background:var(--panel2);border-radius:14px;padding:6px;overflow-x:auto}
.web svg{display:block;margin:0 auto}
.textin{width:100%;border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 11px;font:inherit;color:var(--ink)}
.simbar{display:flex;align-items:center;gap:10px}
.simbar .day{font-family:var(--f-display);font-size:22px;min-width:74px;font-variant-numeric:tabular-nums}
.report{font-size:12.5px;line-height:1.6;background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0}
.report p{margin:0 0 4px}

/* title */
#title{position:fixed;inset:0;z-index:20;display:flex;align-items:center;padding:32px clamp(16px,6vw,80px);padding-top:calc(32px + env(safe-area-inset-top));padding-bottom:calc(32px + env(safe-area-inset-bottom));background:linear-gradient(90deg,rgba(14,30,22,.82) 0%,rgba(14,30,22,.55) 45%,rgba(14,30,22,0) 75%);color:#F3F7F2}
#title .inner{max-width:520px;display:flex;flex-direction:column;gap:18px}
#title .kick{font-size:13px;letter-spacing:.14em;font-weight:700;color:#F5D58A}
#title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,76px);line-height:1.05;margin:0;text-wrap:balance}
#title h1 em{font-style:normal;color:#A9E2B8}
#title p{margin:0;line-height:1.7;font-size:15px;color:#DCE7DE;max-width:44ch}
#title ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
#title ol li{font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;color:#E8F0E9}
#title .acts{display:flex;gap:10px;flex-wrap:wrap}
#title .go{background:#F5C451;color:#1E2A20;border:0;border-radius:16px;padding:16px 30px;font-family:var(--f-display);font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#title .go:hover{transform:translateY(-1px)}
#title .alt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:14px 18px;font-weight:600}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:#1C2A23}

#imgov{position:fixed;inset:0;z-index:40;background:rgba(10,20,15,.7);display:grid;place-items:center;padding:16px}
#imgov .ovbox{background:var(--panel);border-radius:16px;padding:14px;max-width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;overflow:auto}
#imgov img{width:100%;height:auto;border-radius:10px}
#imgov p{margin:0;font-size:13px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;transition:.25s;background:#1C2A23;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:13px;pointer-events:none;max-width:calc(100% - 32px);text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#8E2F27}

@media (max-width:820px){
  #main{flex-direction:column}
  #stage{flex:none;height:50%}
  #panel{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}
  #pbody{padding:14px 16px 18px;gap:14px}
  #pnav{padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  #brand{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
  #brand .bt{display:none}
  #brand .home{display:block}
  #topbar{padding:8px 12px;gap:8px;padding-top:calc(8px + env(safe-area-inset-top))}
  #title{background:linear-gradient(180deg,rgba(14,30,22,.2) 0%,rgba(14,30,22,.9) 38%,rgba(14,30,22,.96) 100%);align-items:flex-end}
  .vbtn{padding:6px 8px;font-size:11px}
  #hint{bottom:50px;font-size:12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div id="app">
  <header id="topbar">
    <button id="brand" type="button" title="처음 화면으로" aria-label="처음 화면으로"><svg class="home" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h13V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span class="bt">나만의 비바리움</span></button>
    <ol id="steps"></ol>
  </header>
  <main id="main">
    <section id="stage">
      <canvas id="c"></canvas>
      <div id="labels"></div>
      <div id="envbadge"></div>
      <div id="hint" hidden></div>
      <div id="selpop" hidden></div>
      <div id="viewctl">
        <button class="vbtn" id="vLabels" type="button">이름표</button>
        <button class="vbtn" id="vSpin" type="button">자동 회전</button>
        <button class="vbtn" id="vTop" type="button">위에서</button>
        <button class="vbtn" id="vFront" type="button">옆에서</button>
        <button class="vbtn" id="vIn" type="button" aria-label="확대">＋</button>
        <button class="vbtn" id="vOut" type="button" aria-label="축소">－</button>
        <button class="vbtn" id="vFull" type="button" hidden>전체 화면</button>
      </div>
      <div id="loading">3D 비바리움을 준비하고 있어요…</div>
    </section>
    <aside id="panel">
      <div id="pbody"></div>
      <footer id="pnav">
        <button class="btn" id="prev" type="button">이전</button>
        <button class="btn primary" id="next" type="button">다음</button>
      </footer>
    </aside>
  </main>
  <div id="title">
    <div class="inner">
      <div class="kick">VIVARIUM · 작은 유리 속 생태계</div>
      <h1>나만의 생태계<br><em>비바리움</em> 만들기</h1>
      <p>유리통을 고르고, 흙과 물과 빛을 채우고, 식물과 동물과 분해자를 차례로 옮겨 심어 보세요. 다 만들면 생태계가 얼마나 건강한지 점검하고 30일 동안의 변화를 관찰할 수 있어요.</p>

/* ============ PNG 저장 ============ */
/* 게시된 웹앱에서는 플랫폼의 downloads 기능으로 저장하고, 없으면 내려받기 → 이미지 보기 순으로 대신한다. */
let dlCap = null, dlP = null;
function getDl() {

}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    if (L.decs.length) { const x0 = L.LW + L.MW + 6; ctx.setLineDash([4, 4]); ctx.strokeStyle = "#7E5C9A"; ctx.lineWidth = 1; rrect(ctx, x0, 4, L.DW, L.H - 8, 12); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = "#7E5C9A"; ctx.font = `10px ${body}`; ctx.textAlign = "center"; ctx.fillText("죽은 생물·배설물", x0 + L.DW / 2, L.H - 12); ctx.textAlign = "left"; }
    L.rows.forEach((r) => { ctx.fillStyle = r.col; ctx.font = `700 11px ${body}`; ctx.fillText(r.label, 4, r.y + 4); });
    Object.keys(L.pos).forEach((id) => { const p = L.pos[id]; ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, TAU); ctx.fill(); ctx.strokeStyle = CAT[SP[id].cat].hex; ctx.lineWidth = 2.5; ctx.stroke(); if (imgs[id]) { ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, TAU); ctx.clip(); ctx.drawImage(imgs[id], p.x - 22, p.y - 22, 44, 44); ctx.restore(); } ctx.fillStyle = "#1C2A23"; ctx.font = `600 10.5px ${body}`; ctx.textAlign = "center"; ctx.fillText(SP[id].name.replace(/\(.*\)/, ""), p.x, p.y + 36); ctx.textAlign = "left"; });

async function savePNG(btn) {
  if (btn) { btn.disabled = true; btn.textContent = "그림을 만들고 있어요…"; }
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    ghost.visible = false; selRing.visible = false;
    renderer.render(scene, camera);
    const shot = await loadImg(canvas.toDataURL("image/png"));
    const ids = [...new Set(state.items.map((i) => i.sp))], imgs = {};
    await Promise.all(ids.map(async (id) => { if (thumbs[id]) imgs[id] = await loadImg(thumbs[id]); }));
    const W = 1800, LEFT = 1000, X = LEFT + 70, CW = W - X - 60;
    const m = document.createElement("canvas").getContext("2d");
    const H = Math.max(1100, Math.ceil(drawReport(m, X, 70, CW, imgs)) + 70);
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#E9EFEA"; ctx.fillRect(0, 0, W, H);
    const sg_ = ctx.createLinearGradient(0, 0, 0, H); sg_.addColorStop(0, "#9fcde8"); sg_.addColorStop(0.6, "#dcecdf"); sg_.addColorStop(1, "#c4ab84");
    ctx.save(); rrect(ctx, 40, 40, LEFT - 40, H - 80, 28); ctx.clip(); ctx.fillStyle = sg_; ctx.fillRect(40, 40, LEFT - 40, H - 80);
    if (shot) { const bw = LEFT - 40, bh = H - 80, s = Math.min(bw / shot.width, bh / shot.height), dw = shot.width * s, dh = shot.height * s; ctx.drawImage(shot, 40 + (bw - dw) / 2, 40 + (bh - dh) / 2, dw, dh); }
    ctx.restore();
    ctx.fillStyle = "#FFFFFF"; rrect(ctx, LEFT + 30, 40, W - LEFT - 70, H - 80, 28); ctx.fill();
    drawReport(ctx, X, 70, CW, imgs);
    const fname = `${(state.name || "나의 비바리움").replace(/[\\/:*?"<>|]/g, "").trim() || "비바리움"}_관찰결과.png`;
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    let saved = false;
    const dl = blob ? await Promise.race([getDl(), new Promise((r) => setTimeout(() => r(null), 1500))]) : null;
    if (dl && blob) {
      try { await dl.save({ filename: fname, data: blob }); toast("PNG로 저장했어요."); saved = true; }
      catch (err) {
        const code = err && err.code;
        if (code === "declined") { toast("저장을 취소했어요."); saved = true; }
        else if (code === "rate_limited") { toast("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요.", true); saved = true; }
