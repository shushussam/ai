/* =========================================================
 * 게임 화면 — 모든 기기가 같은 공개 상태(st)를 받아 똑같이 그린다
 * ========================================================= */

function josa(name, a, b) {
  const c = String(name).charCodeAt(String(name).length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return name + (((c - 0xAC00) % 28) ? a : b);
  return name + a + '(' + b + ')';
}

function bandStyle(k) { return `background-color:${ING[k].band};color:${ING[k].text}`; }

function cardHTML(card, o) {
  const n = card.recipe.length;
  let done = 0, cur = -1, bad = -1;
  const A = o.state;
  if (A) {
    if (A.k === 'chal') { done = A.step; cur = A.step; }
    if (A.k === 'fail') { done = A.picks.length; bad = A.picks.length; }
    if (A.k === 'win') done = n;
  }
  const bands = card.recipe.map((k, i) => {
    const s = n - 1 - i;
    const cls = s < done ? 'done' : s === cur ? 'cur' : s === bad ? 'bad' : '';
    return `<div class="band ${cls}${ING[k].dots ? ' dots' : ''}" style="${bandStyle(k)}"><span>${ING[k].ko}</span></div>`;
  }).join('');
  return `<div class="bcard${o.can ? ' can' : ''}${A ? ' act act-' + A.k : ''}" data-slot="${o.slot}">
    <div class="bc-head"><span class="bc-name${nameCls(card)}">${esc(card.name)}</span><span class="bc-hats">${hatIcon().repeat(card.hats)}</span></div>
    <div class="bc-pic">${burgerSVG(card.recipe)}</div>
    <div class="bc-bands"><div class="bc-up" aria-hidden="true">▲</div>${bands}</div>
    ${A && A.k === 'win' ? '<div class="bc-stamp">완성!</div>' : ''}
  </div>`;
}

function nameCls(card) {
  const u = card.name.length + card.hats * 1.15;
  return u > 10 ? ' xlong' : u > 8.5 ? ' long' : '';
}

function tileFace(k) {
  return `<span class="tb${ING[k].dots ? ' dots' : ''}" style="${bandStyle(k)}">${ING[k].ko}</span><span class="tic">${ingIcon(k)}</span>`;
}

const BOT_ICON = `<svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true"><rect x="8" y="12" width="24" height="20" rx="6" fill="#fff"/><circle cx="15.5" cy="22" r="3" fill="currentColor"/><circle cx="24.5" cy="22" r="3" fill="currentColor"/><rect x="18.5" y="5" width="3" height="7" fill="#fff"/><circle cx="20" cy="5" r="3" fill="#fff"/></svg>`;

const Game = {
  st: null, el: {}, tiles: [], faces: [], prev: null, layoutKey: '', pendingV: -1, pendingT: null,
  peekKey: '', timeOffset: 0, timerInt: null, confirmOpen: false,

  reset() {
    clearInterval(this.timerInt); clearTimeout(this.pendingT);
    this.st = null; this.prev = null; this.tiles = []; this.faces = []; this.layoutKey = ''; this.pendingV = -1; this.peekKey = '';
  },

  build(st, s) {
    this.reset();
    closeModal();
    App.root.onclick = null;
    App.root.innerHTML = `
      <div class="game" id="game">
        <header class="topbar">
          <div class="brand">${logoSVG(34)}<span>스택버거</span></div>
          <div class="tb-mid"><span class="pill" id="g-room"></span><span class="pill timer hidden" id="g-timer"></span></div>
          <div class="tb-right">
            <button class="icon-btn" data-g="rules" aria-label="게임 방법">?</button>
            <button class="icon-btn" data-g="sound" id="g-sound" aria-label="소리 켜기/끄기"></button>
            <button class="icon-btn" data-g="exit" aria-label="나가기">✕</button>
          </div>
        </header>
        <div class="players" id="g-players"></div>
        <main class="board" id="g-board">
          <div class="cards-row"><div class="deck" id="g-deck"></div><div class="open" id="g-open"></div></div>
          <div class="tiles-wrap"><div class="tiles" id="g-tiles"></div></div>
        </main>
        <aside class="side">
          <div class="side-a"><div class="turn" id="g-turn"></div><div class="hint" id="g-hint"></div><div class="actions" id="g-actions"></div></div>
          <div class="stack" id="g-stack"></div>
          <ol class="log" id="g-log"></ol>
        </aside>
        <div class="net-banner hidden" id="g-net"></div>
        <div class="result hidden" id="g-result"></div>
      </div>`;
    const ids = ['game', 'g-room', 'g-timer', 'g-sound', 'g-players', 'g-board', 'g-deck', 'g-open', 'g-tiles', 'g-turn', 'g-hint', 'g-actions', 'g-stack', 'g-log', 'g-net', 'g-result'];
    ids.forEach(id => { this.el[id.replace('g-', '')] = document.getElementById(id); });
    this.el.game.addEventListener('click', e => this.onClick(e));
    this.timerInt = setInterval(() => this.tickTimer(), 500);
    Wake.on();
  },

  myTurn(st) {
    st = st || this.st; const s = App.session;
    if (!st || st.phase !== 'play' || !s || s.role === 'spectator') return false;
    const cur = st.players[st.turn];
    return !!cur && cur.id === App.pid;
  },
  busy() { return this.pendingV === (this.st && this.st.v); },

  send(a) {
    if (!App.session) return;
    this.pendingV = this.st.v;
    clearTimeout(this.pendingT);
    this.pendingT = setTimeout(() => { this.pendingV = -1; if (this.st) this.update(this.st, App.session); }, 3000);
    App.session.act(a);
  },

  onClick(e) {
    const g = e.target.closest('[data-g]');
    if (g) {
      const a = g.dataset.g, s = App.session;
      if (a === 'rules') showRules();
      else if (a === 'sound') { Sound.on = !Sound.on; Store.set('sb-sound', Sound.on); Sound.unlock(); this.renderSoundBtn(); }
      else if (a === 'exit') confirmLeave();
      else if (a === 'pass') this.send({ type: 'pass' });
      else if (a === 'skip' && s && s.skip) s.skip();
      else if (a === 'again' && s && s.restart) s.restart();
      else if (a === 'home') { App.leaveSession(); history.replaceState(null, '', location.pathname + (Net.mode === 'local' ? '?net=local' : '')); App.showHome(); }
      else if (a === 'retry' && s && s.manualRetry) s.manualRetry();
      return;
    }
    const t = e.target.closest('.tile');
    if (t) return this.tapTile(+t.dataset.t);
    const c = e.target.closest('.bcard[data-slot]');
    if (c && c.closest('#g-open')) return this.tapCard(+c.dataset.slot);
  },

  tapTile(i) {
    const st = this.st;
    if (!this.myTurn() || this.busy()) return;
    const A = st.act, T = st.tiles[i];
    if (!T || T.f) return;
    if (A.k === 'idle' && !st.bonus) this.send({ type: 'peek', tile: i });
    else if (A.k === 'chal') this.send({ type: 'pick', tile: i });
    else if (A.k === 'idle' && st.bonus) toast('지금은 버거 카드를 골라 한 번 더 도전하거나, 차례를 마칠 수 있어요');
  },

  tapCard(slot) {
    const st = this.st;
    if (!this.myTurn() || this.busy() || st.act.k !== 'idle') return;
    const cid = st.open[slot];
    if (cid == null) return;
    const card = CARDS[cid];
    this.confirmOpen = true;
    openModal(`<h3>도전할까요?</h3>
      <div class="confirm-card" style="--cw:170px;--ch:246px">${cardHTML(card, { slot: -1 })}</div>
      <p class="center">맨 아래 <b>${ING[card.order[0]].ko}</b>부터 재료 <b>${card.order.length}개</b>를 순서대로 찾아요.</p>
      <div class="m-btns"><button class="btn" data-m="close">취소</button><button class="btn primary" data-m="go">도전!</button></div>`, {
      go: () => { closeModal(); this.confirmOpen = false; this.send({ type: 'challenge', slot }); },
    });
  },

  layout() {
    const st = this.st; if (!st || !this.el.board) return;
    const b = this.el.board;
    const portrait = window.matchMedia('(max-aspect-ratio: 1/1)').matches;
    b.style.height = '';
    const W = b.clientWidth;
    let H = b.clientHeight;
    if (portrait) {
      const g = this.el.game, top = g.querySelector('.topbar').offsetHeight, pl = this.el.players.offsetHeight;
      H = g.clientHeight - top - pl - 250 - 36;
    }
    if (!W || !H) return;
    const nCards = st.settings.openCount + 1, rows = st.settings.tilesPer, cols = 7;
    const gap = Math.round(Math.max(6, Math.min(14, W * 0.012)));
    let cw = Math.min(176, (W - gap * (nCards - 1)) / nCards);
    let ch = cw * 1.45;
    const maxCh = H * (rows <= 2 ? 0.47 : rows === 3 ? 0.4 : 0.35);
    if (ch > maxCh) { ch = maxCh; cw = ch / 1.45; }
    const tilesH = H - ch - gap * 2;
    let tw = (W - gap * (cols - 1)) / cols, th = tw * 1.3;
    const maxTh = (tilesH - gap * (rows - 1)) / rows;
    if (th > maxTh) { th = maxTh; tw = th / 1.3; }
    if (tw > 132) { tw = 132; th = tw * 1.3; }
    const S = this.el.game.style;
    S.setProperty('--cw', cw.toFixed(1) + 'px'); S.setProperty('--ch', ch.toFixed(1) + 'px');
    S.setProperty('--tw', tw.toFixed(1) + 'px'); S.setProperty('--th', th.toFixed(1) + 'px');
    S.setProperty('--gap', gap + 'px');
    if (portrait) b.style.height = Math.ceil(ch + gap * 3 + rows * th + (rows - 1) * gap + 8) + 'px';
  },

  ensureTiles(n) {
    if (this.tiles.length === n) return;
    this.el.tiles.innerHTML = Array.from({ length: n }, (_, i) =>
      `<button class="tile" data-t="${i}" aria-label="재료타일 ${i + 1}"><span class="ti"><span class="tf front"></span><span class="tf back"></span></span></button>`).join('');
    this.tiles = $$('.tile', this.el.tiles);
    this.faces = new Array(n).fill(null);
  },

  renderSoundBtn() {
    this.el.sound.innerHTML = Sound.on
      ? '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'
      : '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  },

  update(st, s) {
    const prev = this.prev;
    this.st = st;
    if (this.pendingV !== -1 && st.v !== this.pendingV) { this.pendingV = -1; clearTimeout(this.pendingT); }
    if (st.now) this.timeOffset = Date.now() - st.now;
    const key = `${st.settings.openCount}|${st.settings.tilesPer}`;
    this.ensureTiles(st.tiles.length);
    if (key !== this.layoutKey) { this.layoutKey = key; this.layout(); requestAnimationFrame(() => this.layout()); }

    const me = App.pid, A = st.act, cur = st.players[st.turn];
    const mine = this.myTurn(st), busy = this.busy();
    const playing = st.phase === 'play';

    // 상단
    this.el.room.textContent = s.role === 'solo'
      ? `혼자 연습 · 컴퓨터 ${(AI_LEVELS[(st.players.find(p => p.isAI) || {}).level] || {}).ko || ''}`
      : `방 ${st.room}${s.role === 'spectator' ? ' · 관전' : ''}`;
    this.renderSoundBtn();
    this.el.timer.classList.toggle('hidden', !st.endsAt);

    // 플레이어
    this.el.players.innerHTML = st.players.map((p, i) => `
      <div class="pchip${playing && i === st.turn ? ' turn' : ''}${p.id === me ? ' me' : ''}${p.online === false ? ' off' : ''}" style="--pc:${p.color}">
        <div class="av">${p.isAI ? BOT_ICON : esc(p.name.slice(0, 1))}</div>
        <div class="pi">
          <div class="pn">${esc(p.name)}${p.id === me && p.name !== '나' ? '<span class="me-tag">나</span>' : ''}${p.online === false ? '<span class="off-tag">연결 끊김</span>' : ''}</div>
          <div class="ps">${hatIcon(20)}<b>${p.hats}</b><span class="of">/ ${st.settings.target}</span><span class="pc">버거 ${p.cards.length}</span></div>
          <div class="pbar"><i style="width:${Math.min(100, p.hats / st.settings.target * 100)}%"></i></div>
        </div>
      </div>`).join('');

    // 버거 카드
    const actSlot = (A.k === 'chal' || A.k === 'fail' || A.k === 'win') ? A.slot : -1;
    const canCard = mine && A.k === 'idle' && !busy;
    this.el.open.innerHTML = st.open.map((cid, slot) => cid == null
      ? `<div class="bcard empty"><span>빈 자리</span></div>`
      : cardHTML(CARDS[cid], { slot, can: canCard, state: slot === actSlot ? A : null })).join('');
    this.el.deck.innerHTML = `<div class="deck-card${st.deck ? '' : ' none'}">${cardBackSVG()}</div><span class="deck-n">남은 카드 <b>${st.deck}</b></span>`;

    // 재료타일
    const canTile = mine && !busy && ((A.k === 'idle' && !st.bonus) || A.k === 'chal');
    st.tiles.forEach((T, i) => {
      const el = this.tiles[i];
      if (T.f && this.faces[i] !== T.f) { $('.back', el).innerHTML = tileFace(T.f); this.faces[i] = T.f; }
      el.className = 'tile' + (T.f ? ' up' : '') + (T.m ? ' m-' + T.m : '') + (canTile && !T.f ? ' can' : '');
      el.disabled = !(canTile && !T.f);
    });
    this.el.tiles.classList.toggle('my', canTile);

    // 옆 패널
    this.el.turn.innerHTML = !playing ? '<b>게임 끝!</b>'
      : mine ? `<span class="tdot" style="background:${cur.color}"></span><b>내 차례!</b>`
      : `<span class="tdot" style="background:${cur.color}"></span><b>${esc(cur.name)}</b> 차례`;
    this.el.turn.style.setProperty('--pc', cur ? cur.color : '#999');
    this.el.turn.classList.toggle('mine', mine);
    this.el.hint.innerHTML = this.hintHTML(st, s, mine, cur);
    this.el.stack.innerHTML = this.stackHTML(st);
    let btns = '';
    if (mine && A.k === 'idle' && st.bonus) btns += `<button class="btn primary wide" data-g="pass">차례 마치기</button>`;
    if (s.role === 'host' && playing && cur && cur.online === false && (A.k === 'idle' || A.k === 'chal')) btns += `<button class="btn danger wide" data-g="skip">${esc(cur.name)} 차례 건너뛰기</button>`;
    this.el.actions.innerHTML = btns;
    this.el.log.innerHTML = st.log.slice(-6).reverse().map(l => `<li style="--lc:${l.c || '#C9B08A'}">${esc(l.t)}</li>`).join('');

    // 확인 시간 막대
    if (A.k === 'peek') {
      const k = `${st.round}-${A.tile}`;
      if (this.peekKey !== k) { this.peekKey = k; }
      const bar = $('.peekbar i', this.el.hint);
      if (bar) bar.style.animationDuration = (A.ms / SPEED) + 'ms';
    }

    if (this.confirmOpen && (!mine || A.k !== 'idle')) { closeModal(); this.confirmOpen = false; }

    // 연결 상태
    let net = '';
    if ((s.role === 'client' || s.role === 'spectator') && s.status === 'reconnecting') net = '방장과 다시 연결하는 중… 잠시만 기다려 주세요';
    if ((s.role === 'client' || s.role === 'spectator') && s.status === 'lost') net = '방장과 연결이 끊겼어요. <button class="btn small" data-g="retry">다시 연결</button> <button class="btn small" data-g="home">나가기</button>';
    if (s.role === 'host' && s.netStatus === 'reconnecting') net = '인터넷 연결을 다시 잡는 중…';
    this.el.net.innerHTML = net;
    this.el.net.classList.toggle('hidden', !net);

    this.effects(prev, st, mine);
    this.renderResult(st, s);
    this.tickTimer();
    this.prev = JSON.parse(JSON.stringify({ tiles: st.tiles, act: st.act, turn: st.turn, round: st.round, phase: st.phase, v: st.v }));
  },

  hintHTML(st, s, mine, cur) {
    const A = st.act;
    if (st.phase !== 'play') return '게임이 끝났어요.';
    const who = cur ? esc(cur.name) : '';
    if (A.k === 'peek') {
      return `${mine ? '모두가 함께 보고 있어요. <b>위치를 기억하세요!</b>' : `${who}${josa(who, '이', '가').slice(who.length)} 뒤집은 재료를 <b>기억하세요!</b>`}<div class="peekbar"><i></i></div>`;
    }
    if (A.k === 'chal') {
      const card = CARDS[A.card], need = card.order[A.step];
      return mine
        ? `<div class="need"><span class="ni">${ingIcon(need, 40)}</span><span><b>${A.step + 1}번째 재료</b><br>${ING[need].ko} 타일을 찾아 누르세요</span></div>`
        : `${who} 도전 중 · <b>${esc(card.name)}</b><br>다음 재료: ${ING[need].ko} (${A.step}/${card.order.length})`;
    }
    if (A.k === 'fail') return `<b class="bad">아쉬워요!</b> ${ING[A.need].ko} 자리가 아니었어요. 타일을 다시 덮어요.`;
    if (A.k === 'win') return `<b class="good">성공!</b> ${who} 모자 <b>+${A.gain}</b>`;
    if (mine) return st.bonus
      ? '<b class="good">성공!</b> 버거 카드를 눌러 <b>한 번 더 도전</b>하거나, 차례를 마치세요.'
      : '<b>재료타일</b>을 눌러 확인하거나,<br><b>버거 카드</b>를 눌러 도전하세요.';
    if (cur && cur.online === false) return `${who} 연결이 끊겼어요. 다시 들어오기를 기다리는 중…`;
    if (cur && cur.isAI) return `${josa(who, '이', '가')} ${st.bonus ? '한 번 더 도전할지 고민 중…' : '생각하고 있어요…'}`;
    return `${who}${josa(who, '이', '가').slice(who.length)} 고르는 중이에요.`;
  },

  stackHTML(st) {
    const A = st.act;
    if (A.k === 'chal' || A.k === 'fail' || A.k === 'win') {
      const card = CARDS[A.card], n = card.order.length;
      const got = A.k === 'win' ? n : A.picks.length;
      const skey = `${st.round}|${A.card}`;
      const fresh = this.stackKey !== skey ? 0 : this.stackGot;
      this.stackKey = skey; this.stackGot = got;
      const layers = card.order.map((k, i) => {
        if (i < got) return `<div class="layer in${i >= fresh ? ' drop' : ''}" style="${bandStyle(k)}"><span class="li">${ingIcon(k, 24)}</span><span>${ING[k].ko}</span></div>`;
        if (A.k === 'chal' && i === A.step) return `<div class="layer next"><span>다음: ${ING[k].ko}</span></div>`;
        if (A.k === 'fail' && i === got) { const w = st.tiles[A.wrong] && st.tiles[A.wrong].f; return `<div class="layer wrong"><span class="li">${w ? ingIcon(w, 24) : ''}</span><span>${w ? ING[w].ko : ''} ✕</span></div>`; }
        return `<div class="layer empty"></div>`;
      }).join('');
      return `<div class="st-title"><span>스택 쌓기</span><b>${esc(card.name)}</b></div>
        <div class="st-stack${A.k === 'fail' ? ' shake' : ''}">${layers}</div>
        <div class="st-foot">${A.k === 'win' ? '완성!' : A.k === 'fail' ? '실패 — 모두 다시 덮어요' : `${got} / ${n} 쌓음 · 아래부터 위로`}</div>`;
    }
    this.stackKey = ''; this.stackGot = 0;
    return `<div class="st-title"><span>스택 쌓기</span></div>
      <div class="st-stack idle"><div class="plate"></div></div>
      <div class="st-foot">도전하면 재료가 <b>아래부터</b> 차곡차곡 쌓여요</div>`;
  },

  effects(prev, st, mine) {
    if (!prev) { if (mine) this.flash('내 차례!', st.players[st.turn].color); return; }
    const A = st.act, P = prev.act;
    const newly = st.tiles.some((t, i) => t.f && !(prev.tiles[i] && prev.tiles[i].f));
    if (newly && A.k !== 'win' && A.k !== 'fail') Sound.flip();
    if (A.k === 'chal' && P.k === 'chal' && A.step > P.step) Sound.ok();
    if (A.k === 'win' && P.k !== 'win') { Sound.win(); this.confetti(A.slot); }
    if (A.k === 'fail' && P.k !== 'fail') { Sound.bad(); this.el.board.classList.remove('shake'); void this.el.board.offsetWidth; this.el.board.classList.add('shake'); }
    if (st.phase === 'play' && (st.turn !== prev.turn || st.round !== prev.round) && mine && !(A.k === 'idle' && st.bonus)) { Sound.turn(); this.flash('내 차례!', st.players[st.turn].color); }
    if (st.phase === 'over' && prev.phase !== 'over') Sound.end();
    if (st.v < prev.v) this.peekKey = '';
  },

  flash(text, color) {
    const f = document.createElement('div');
    f.className = 'flash'; f.style.setProperty('--pc', color || '#E5483B'); f.textContent = text;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1300);
  },

  confetti(slot) {
    const card = $(`#g-open .bcard[data-slot="${slot}"]`);
    const r = card ? card.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    const cx = r.left + r.width / 2, cy = r.top + r.height / 3;
    const colors = ['#E5483B', '#FFC531', '#5DB04A', '#2D7FF9', '#F39A2B', '#9B51E0'];
    for (let i = 0; i < 36; i++) {
      const p = document.createElement('i');
      p.className = 'cf';
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 160;
      p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i % colors.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 60}px;--r:${Math.random() * 720 - 360}deg`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  },

  renderResult(st, s) {
    const el = this.el.result;
    if (st.phase !== 'over' || !st.result) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    if (!el.classList.contains('hidden') && el.dataset.v === String(st.v)) return;
    el.dataset.v = String(st.v);
    const R = st.result, me = App.pid;
    const mine = R.ranking.find(r => r.id === me);
    const title = s.role === 'spectator' ? `${esc(R.ranking[0].name)} 우승!`
      : mine && mine.rank === 1 ? (s.role === 'solo' ? '이겼어요!' : '우승!') : (s.role === 'solo' ? '아쉬워요!' : `${esc(R.ranking[0].name)} 우승!`);
    const why = { target: `요리사 모자 ${st.settings.target}개를 먼저 모았어요.`, deck: '버거 카드를 모두 만들었어요.', time: '제한 시간이 끝났어요.' }[R.reason] || '';
    const isHostLike = s.role === 'host' || s.role === 'solo';
    el.innerHTML = `<div class="res-card">
      <div class="res-logo">${logoSVG(84)}</div>
      <h2>${title}</h2><p class="muted">${why}</p>
      <ol class="rank">${R.ranking.map(r => `<li class="r${r.rank}" style="--pc:${r.color}"><span class="rk">${r.rank}위</span><span class="nm">${esc(r.name)}${r.id === me && r.name !== '나' ? ' (나)' : ''}</span><span class="ht">${hatIcon(22)}<b>${r.hats}</b></span><span class="cd">버거 ${r.cards}</span></li>`).join('')}</ol>
      <div class="m-btns">${isHostLike ? '<button class="btn" data-g="home">처음으로</button><button class="btn primary" data-g="again">다시 하기</button>'
        : '<button class="btn" data-g="home">나가기</button><span class="muted small">방장이 다시 시작하면 자동으로 시작돼요</span>'}</div>
    </div>`;
    el.classList.remove('hidden');
  },

  tickTimer() {
    const st = this.st; if (!st || !st.endsAt || !this.el.timer) return;
    const left = Math.max(0, st.endsAt - (Date.now() - this.timeOffset));
    const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
    this.el.timer.textContent = st.phase !== 'play' ? '시간 종료' : left > 0 ? `남은 시간 ${m}:${String(sec).padStart(2, '0')}` : '이번 차례가 끝나면 종료';
    this.el.timer.classList.toggle('low', left < 60000);
  },
};


/* 시작 */
(function () {
  const em = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 84"><path d="M10 40 Q10 6 50 6 Q90 6 90 40Z" fill="#FFD490"/><path d="M4 46 Q12 40 20 46 Q28 40 36 46 Q44 40 52 46 Q60 40 68 46 Q76 40 84 46 Q92 40 96 46 V52 H4Z" fill="#FFD490"/><rect x="8" y="56" width="84" height="10" rx="5" fill="#FFD490"/><rect x="12" y="69" width="76" height="12" rx="6" fill="#FFD490"/></svg>';
  document.documentElement.style.setProperty('--emblem', `url("data:image/svg+xml;utf8,${encodeURIComponent(em)}")`);
  // 카드 데이터 점검: 같은 재료는 한 카드에 최대 2개 (초급 14장으로도 항상 완성 가능)
  CARDS.forEach(c => {
    const cnt = {}; c.recipe.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; });
    if (Object.values(cnt).some(v => v > 2)) console.warn('재료 3개 이상 카드:', c.name);
  });
  App.init();
  window.__SB = { App, Game, Engine, HostSession, ClientSession, CARDS, ING, Net, Store };
})();

</script>
