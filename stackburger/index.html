<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC531">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="스택버거 — 버거 재료를 아래부터 순서대로 쌓는 기억력 보드게임. 2~4명이 각자 태블릿으로 함께 하거나 컴퓨터와 1:1로 연습해요.">
<title>스택버거 — 온라인 보드게임</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M12 46 Q12 12 50 12 Q88 12 88 46Z' fill='%23E9A453'/%3E%3Crect x='8' y='50' width='84' height='10' rx='3' fill='%236CBF4B'/%3E%3Crect x='8' y='62' width='84' height='12' rx='5' fill='%235C3524'/%3E%3Crect x='12' y='76' width='76' height='12' rx='6' fill='%23E08A3F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3B2416; --muted: #8A6A4F; --bg1: #FFF7E8; --bg2: #FFE8BF;
  --ketchup: #E5483B; --mustard: #FFC531; --lettuce: #4FA33E; --line: #F0DDBD; --panel: #FFFFFF;
  --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --body: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif;
  --topH: 56px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--body); color: var(--ink); background: linear-gradient(180deg, var(--bg1), var(--bg2)) fixed; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
input { -webkit-user-select: text; user-select: text; }
button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
b.good { color: #1E8E4E; } b.bad { color: #C0392B; }

/* ---------- 버튼 ---------- */
.btn { min-height: 48px; padding: 0 20px; border-radius: 14px; border: 0; font-weight: 800; font-size: 17px; background: #F3E2C3; color: var(--ink); box-shadow: 0 3px 0 #DCC49C; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #DCC49C; }
.btn.primary { background: var(--ketchup); color: #fff; box-shadow: 0 4px 0 #B3352B; }
.btn.primary:active { box-shadow: 0 1px 0 #B3352B; }
.btn.danger { background: #3B2416; color: #fff; box-shadow: 0 4px 0 #1d110a; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.big { min-height: 60px; font-size: 22px; padding: 0 40px; border-radius: 18px; }
.btn.wide { width: 100%; }
.btn.ghost { background: #fff; border: 2px solid var(--line); box-shadow: none; }
.btn:disabled { opacity: .45; pointer-events: none; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 16px; text-decoration: underline; padding: 10px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-weight: 900; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }

/* ---------- 홈 ---------- */
.screen { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
.home .hero { text-align: center; margin-bottom: 18px; }
.hero-logo { animation: bob 2.6s ease-in-out infinite; display: inline-block; }
.home h1 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 9vw, 76px); margin: 6px 0 0; letter-spacing: 2px; color: #4A2C1E; text-shadow: 0 4px 0 #FFD58A; }
.home .sub { font-size: 18px; margin: 6px 0 0; }
.home-btns { display: grid; gap: 14px; width: min(460px, 92vw); }
.big-btn { display: flex; align-items: center; gap: 16px; border: 0; border-radius: 22px; padding: 14px 20px; min-height: 86px; text-align: left; box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s; }
.big-btn:active { transform: translateY(3px); }
.big-btn .bb-ico { width: 58px; height: 58px; border-radius: 16px; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; flex: none; }
.big-btn b { display: block; font-family: var(--display); font-weight: 400; font-size: 27px; }
.big-btn small { font-size: 15px; opacity: .9; }
.b-solo { background: var(--mustard); color: #4A2C00; }
.b-host { background: var(--ketchup); color: #fff; }
.b-join { background: var(--lettuce); color: #fff; }
.resume { display: grid; gap: 8px; margin-top: 14px; width: min(460px, 92vw); }
.credit { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }

/* ---------- 설정 카드 ---------- */
.setup-card { background: var(--panel); border-radius: 24px; padding: 22px 24px 26px; width: min(600px, 94vw); box-shadow: 0 10px 30px rgba(120,70,20,.15); position: relative; }
.setup-card h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 8px 0 4px; }
.back { background: none; border: 0; font-size: 16px; color: var(--muted); padding: 6px 0; font-weight: 700; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; flex-wrap: wrap; }
.field > span { font-weight: 800; font-size: 16px; min-width: 84px; }
.field input { flex: 1; min-width: 180px; height: 50px; border-radius: 14px; border: 2px solid var(--line); padding: 0 14px; font-size: 20px; font-weight: 700; background: #FFFCF6; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--mustard); }
.code-input { letter-spacing: 8px; font-family: var(--display); font-size: 30px !important; text-align: center; }
.check { display: flex; align-items: center; gap: 10px; font-size: 16px; margin: 6px 0; }
.check input { width: 22px; height: 22px; }
.err { color: #C0392B; font-weight: 700; min-height: 1.2em; margin: 6px 0 10px; }
.seg { display: inline-flex; background: #F6EBD6; border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 42px; padding: 0 14px; border-radius: 10px; font-weight: 800; font-size: 15px; color: var(--muted); }
.seg button.on { background: var(--ink); color: #fff; }
.seg.ro button { cursor: default; }
.seg.ro button:not(.on) { opacity: .5; }

/* ---------- 바쁜 화면 ---------- */
.busy p { font-size: 20px; font-weight: 700; }
.spinner { animation: bob 1.2s ease-in-out infinite; }

/* ---------- 대기실 ---------- */
.lobby { justify-content: flex-start; padding-top: 16px; }
.lobby-top { display: flex; align-items: center; gap: 14px; width: min(1180px, 96vw); }
.lobby-top h2 { font-family: var(--display); font-weight: 400; font-size: 32px; margin: 0; flex: 1; }
.lobby-grid { display: grid; grid-template-columns: 1fr 1.1fr 1.3fr; gap: 14px; width: min(1180px, 96vw); margin-top: 10px; }
.panel { background: var(--panel); border-radius: 22px; padding: 18px; box-shadow: 0 6px 20px rgba(120,70,20,.1); }
.panel h3 { margin: 0 0 10px; font-size: 19px; }
.lp-room { text-align: center; }
.lp-room .lbl { font-weight: 800; color: var(--muted); }
.room-code { font-family: var(--display); font-size: 56px; letter-spacing: 6px; color: var(--ketchup); line-height: 1.1; }
.qr { width: 190px; height: 190px; margin: 8px auto; background: #fff; border-radius: 12px; padding: 4px; }
.qr svg { width: 100%; height: 100%; }
.link-row { display: flex; gap: 6px; }
.link-row input { flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 2px solid var(--line); padding: 0 8px; font-size: 13px; color: var(--muted); }
.seats { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: #FFF8EC; border: 2px solid var(--line); min-height: 56px; }
.seat .dot { width: 38px; height: 38px; border-radius: 50%; background: var(--pc); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
.seat .nm { font-weight: 800; font-size: 18px; flex: 1; }
.seat.empty { border-style: dashed; background: transparent; color: #C7AE8A; }
.seat.empty .dot { background: #F2E4CC; }
.tag { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #F3E2C3; }
.tag.me { background: var(--ink); color: #fff; } .tag.ai { background: #E3EEFF; color: #2D5FB3; } .tag.off { background: #FDE2DF; color: #B23A2E; }
.seat .x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #F3E2C3; font-weight: 900; }
.add-ai { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.add-ai span { font-weight: 800; margin-right: 4px; }
.lp-settings .field { margin: 10px 0; }
.lp-settings .field > span { min-width: 74px; }
.lobby-bottom { display: flex; align-items: center; gap: 16px; margin-top: 18px; width: min(1180px, 96vw); justify-content: center; flex-wrap: wrap; }
.waiting { font-size: 20px; font-weight: 800; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.waiting i { width: 10px; height: 10px; border-radius: 50%; background: var(--mustard); animation: dotb 1s infinite; }
.waiting i:nth-child(2) { animation-delay: .15s; } .waiting i:nth-child(3) { animation-delay: .3s; }

/* ---------- 게임 화면 ---------- */
.game { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 23vw, 300px); grid-template-rows: var(--topH) auto minmax(0, 1fr); grid-template-areas: "top top" "players side" "board side"; gap: 8px 12px; padding: 0 12px 12px; }
.topbar { grid-area: top; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 24px; }
.tb-mid { flex: 1; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pill { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; white-space: nowrap; }
.pill.timer.low { background: #FDE2DF; border-color: #F3A79E; color: #B23A2E; }
.tb-right { display: flex; gap: 8px; }

.players { grid-area: players; display: flex; gap: 8px; min-width: 0; }
.pchip { flex: 1 1 0; min-width: 0; max-width: 300px; display: flex; align-items: center; gap: 8px; background: #fff; border: 3px solid transparent; border-radius: 16px; padding: 6px 10px; box-shadow: 0 3px 10px rgba(120,70,20,.08); transition: transform .2s, box-shadow .2s; position: relative; }
.pchip.turn { border-color: var(--pc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 22%, transparent), 0 6px 16px rgba(0,0,0,.12); transform: translateY(-2px); }
.pchip.off { opacity: .55; }
.pchip .av { width: 40px; height: 40px; border-radius: 50%; background: var(--pc); color: #fff; font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; flex: none; }
.pchip .av svg { color: var(--pc); }
.pi { min-width: 0; flex: 1; }
.pn { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-tag { font-size: 11px; background: var(--ink); color: #fff; border-radius: 999px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
.off-tag { font-size: 11px; background: #FDE2DF; color: #B23A2E; border-radius: 999px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
.ps { display: flex; align-items: center; gap: 4px; font-size: 14px; }
.ps b { font-family: var(--display); font-size: 22px; font-weight: 400; line-height: 1; }
.ps .of { color: var(--muted); }
.ps .pc { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.pbar { height: 5px; background: #F3E6CF; border-radius: 3px; margin-top: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--pc); border-radius: 3px; transition: width .5s; }

.board { grid-area: board; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap, 10px); min-height: 0; min-width: 0; padding-top: 4px; }
.board.shake { animation: shake .45s; }
.cards-row { display: flex; gap: var(--gap, 10px); align-items: flex-end; }
.open { display: flex; gap: var(--gap, 10px); }
.tiles-wrap { flex: 0 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; width: 100%; }
.tiles { display: grid; grid-template-columns: repeat(7, var(--tw, 80px)); gap: var(--gap, 10px); }

/* 버거 카드 */
.bcard { width: var(--cw); height: var(--ch); background: #fff; border-radius: calc(var(--cw) * .08); box-shadow: 0 4px 12px rgba(120,70,20,.16); display: flex; flex-direction: column; padding: calc(var(--cw) * .05); position: relative; border: 3px solid transparent; transition: transform .15s, border-color .15s, box-shadow .15s; }
.bcard.can { cursor: pointer; border-color: #FFE08A; animation: glow 1.6s ease-in-out infinite; }
.bcard.can:active { transform: translateY(2px) scale(.98); }
.bcard.act { border-color: #FF8A00; box-shadow: 0 0 0 4px #FFD58A, 0 8px 18px rgba(0,0,0,.15); transform: translateY(-4px); }
.bcard.act-win { border-color: #2FBF71; box-shadow: 0 0 0 4px #BDF0D3; }
.bcard.act-fail { border-color: #E5483B; box-shadow: 0 0 0 4px #F9C9C3; }
.bcard.empty { background: transparent; border: 3px dashed #E5C99B; box-shadow: none; align-items: center; justify-content: center; color: #C9A774; font-weight: 800; font-size: calc(var(--cw) * .1); }
.bc-head { display: flex; justify-content: space-between; align-items: center; gap: 2px; font-weight: 800; font-size: calc(var(--cw) * .098); line-height: 1.2; }
.bc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.5px; }
.bc-name.long { font-size: calc(var(--cw) * .085); }
.bc-name.xlong { font-size: calc(var(--cw) * .074); }
.bc-hats { display: flex; flex: none; }
.bc-hats svg { width: calc(var(--cw) * .11); height: calc(var(--cw) * .11); margin-left: 1px; }
.bc-pic { flex: 0 0 25%; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 2px 0; }
.bc-pic svg { height: 100%; width: auto; max-width: 78%; }
.bc-bands { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; border-radius: calc(var(--cw) * .05); overflow: hidden; position: relative; min-height: 0; }
.bc-up { position: absolute; left: 2px; bottom: 1px; font-size: calc(var(--cw) * .07); color: rgba(255,255,255,.9); text-shadow: 0 0 2px rgba(0,0,0,.6); z-index: 2; }
.band { flex: 0 0 calc((var(--ch) * .58) / 6.4); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cw) * .088); font-weight: 800; position: relative; white-space: nowrap; letter-spacing: -.5px; }
.dots { background-image: radial-gradient(rgba(255,255,255,.75) 1.1px, transparent 1.5px); background-size: 9px 7px; }
.band.done { opacity: .45; }
.band.done::after { content: '✓'; position: absolute; right: 4px; font-weight: 900; }
.band.cur { box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #FF8A00; animation: pulse 1s ease-in-out infinite; }
.band.bad { box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #E5483B; }
.bc-stamp { position: absolute; inset: 22% 6%; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: calc(var(--cw) * .2); color: #1E8E4E; border: 4px solid #1E8E4E; border-radius: 14px; background: rgba(255,255,255,.82); transform: rotate(-12deg); animation: stamp .35s ease-out; }
.confirm-card { display: flex; justify-content: center; margin: 6px 0 10px; }

.deck { width: var(--cw); height: var(--ch); position: relative; flex: none; }
.deck-card { position: absolute; inset: 0; border-radius: calc(var(--cw) * .08); overflow: hidden; box-shadow: 3px 3px 0 #fff, 5px 5px 0 #E2C7A0, 7px 7px 0 #fff, 9px 9px 0 #E2C7A0; }
.deck-card svg { width: 100%; height: 100%; display: block; }
.deck-card.none { opacity: .25; box-shadow: none; }
.deck-n { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); background: rgba(59,36,22,.85); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: calc(var(--cw) * .08); white-space: nowrap; font-weight: 700; }
.deck-n b { font-family: var(--display); font-weight: 400; font-size: 1.25em; }

/* 재료타일 */
.tile { width: var(--tw); height: var(--th); padding: 0; border: 0; background: none; perspective: 700px; position: relative; }
.tile:disabled { cursor: default; color: inherit; }
.ti { position: absolute; inset: 0; transition: transform .5s cubic-bezier(.3,.8,.35,1.15); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
.tile.up .ti { transform: rotateY(180deg); }
.tf { position: absolute; inset: 0; border-radius: calc(var(--tw) * .12); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.tf.front { background-color: #F39A2B; background-image: var(--emblem), repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 6px, transparent 6px 14px); background-repeat: no-repeat, repeat; background-position: center, 0 0; background-size: 58% auto, auto; box-shadow: inset 0 0 0 3px #FFE6BF, 0 3px 0 #C9741B, 0 5px 10px rgba(120,70,20,.2); }
.tf.back { transform: rotateY(180deg); background: #fff; display: flex; flex-direction: column; box-shadow: inset 0 0 0 2px #EEDCC0, 0 5px 12px rgba(120,70,20,.22); }
.tb { flex: 0 0 24%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--tw) * .17); white-space: nowrap; letter-spacing: -.5px; }
.tic { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 6%; }
.tic svg { width: 88%; height: auto; max-height: 100%; }
.tiles.my .tile.can .tf.front { box-shadow: inset 0 0 0 3px #FFF3D6, 0 3px 0 #C9741B, 0 0 0 3px rgba(255,197,49,.55), 0 6px 14px rgba(120,70,20,.25); }
.tile.can:active .ti { transform: scale(.95); }
.tile.m-peek .tf.back { box-shadow: 0 0 0 4px var(--mustard), 0 8px 16px rgba(0,0,0,.2); }
.tile.m-ok .tf.back { box-shadow: 0 0 0 4px #2FBF71, 0 8px 16px rgba(0,0,0,.2); }
.tile.m-bad .tf.back { box-shadow: 0 0 0 4px #E5483B, 0 8px 16px rgba(0,0,0,.2); }
.tile.m-bad { animation: shake .5s .45s; }

/* 옆 패널 */
.side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.side-a { display: flex; flex-direction: column; gap: 8px; }
.turn { background: #fff; border-radius: 16px; padding: 10px 14px; font-size: 20px; display: flex; align-items: center; gap: 8px; border: 3px solid var(--pc); }
.turn b { font-family: var(--display); font-weight: 400; font-size: 25px; }
.turn.mine { background: var(--pc); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
.tdot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid #fff; }
.hint { background: #FFF2D6; border-radius: 14px; padding: 10px 12px; font-size: 15.5px; line-height: 1.45; min-height: 66px; }
.need { display: flex; align-items: center; gap: 8px; }
.need .ni { width: 44px; height: 44px; flex: none; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.peekbar { height: 7px; background: #FFE1A6; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.peekbar i { display: block; height: 100%; background: #FF8A00; border-radius: 4px; animation: shrink 3s linear forwards; transform-origin: left; }
.actions { display: grid; gap: 8px; }
.actions:empty { display: none; }
.stack { flex: 1; min-height: 150px; background: #fff; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.st-title { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 800; }
.st-title b { color: var(--ink); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-stack { flex: 1; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 4px; padding: 6px 8px 10px; background: radial-gradient(ellipse 70% 10px at 50% calc(100% - 4px), #E9DCC6 98%, transparent 100%); min-height: 0; overflow: hidden; }
.st-stack.shake { animation: shake .5s; }
.st-stack.idle { align-items: center; }
.plate { width: 70%; height: 14px; border-radius: 50%; background: #E9DCC6; margin-top: auto; }
.layer { flex: 0 0 auto; height: clamp(26px, 4.4vh, 36px); border-radius: 10px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-weight: 800; font-size: 15px; }
.layer.in { box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.layer.drop { animation: drop .35s cubic-bezier(.3,1.4,.5,1); }
.layer .li { width: 24px; height: 24px; flex: none; display: flex; }
.layer.next { border: 3px dashed #FF8A00; color: #B35C00; background: #FFF6E3; justify-content: center; animation: pulse 1s ease-in-out infinite; }
.layer.empty { border: 2px dashed #E6D3B3; }
.layer.wrong { border: 3px solid #E5483B; color: #E5483B; background: #fff; }
.st-foot { text-align: center; font-size: 13px; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; max-height: 150px; overflow: hidden; }
.log li { border-left: 4px solid var(--lc); padding: 2px 8px; background: rgba(255,255,255,.65); border-radius: 0 8px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log li:first-child { font-weight: 800; background: #fff; }

/* 결과 */
.result { position: fixed; inset: 0; background: rgba(59,36,22,.55); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
.res-card { background: #fff; border-radius: 26px; padding: 22px 26px; width: min(520px, 94vw); text-align: center; animation: pop .35s ease-out; }
.res-card h2 { font-family: var(--display); font-weight: 400; font-size: 44px; margin: 4px 0; color: var(--ketchup); }
.rank { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
.rank li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #FFF8EC; border: 3px solid transparent; font-size: 17px; }
.rank li.r1 { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 10%, #fff); }
.rank .rk { font-family: var(--display); font-size: 22px; width: 46px; }
.rank .nm { flex: 1; text-align: left; font-weight: 800; }
.rank .ht { display: flex; align-items: center; gap: 4px; } .rank .ht b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.rank .cd { color: var(--muted); font-size: 14px; width: 62px; text-align: right; }

/* 모달 */
.modal-back { position: fixed; inset: 0; background: rgba(40,24,14,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; animation: fade .15s; }
.modal { background: #fff; border-radius: 22px; padding: 22px; width: min(460px, 94vw); max-height: 92vh; overflow: auto; animation: pop .2s ease-out; }
.modal-back.wide .modal { width: min(700px, 95vw); }
.modal h3 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 30px; }
.modal p { font-size: 16px; line-height: 1.5; }
.m-btns { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.m-btns .btn { min-width: 120px; }
.tips { padding-left: 20px; line-height: 1.6; }
.rules { display: grid; gap: 10px; }
.r-row { display: flex; gap: 12px; align-items: center; background: #FFF8EC; border-radius: 14px; padding: 10px 12px; font-size: 16px; line-height: 1.45; }
.r-row.teacher { background: #EEF6FF; }
.r-ico { width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; }
.r-ico.ok { color: #1E8E4E; } .r-ico.bad { color: #E5483B; }
.cb-mini { width: 32px; height: 44px; border-radius: 5px; overflow: hidden; }
.cb-mini svg { width: 100%; height: 100%; }

/* 알림 */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; background: rgba(40,24,14,.92); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 60; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
.net-banner { position: fixed; top: 0; left: 0; right: 0; background: #3B2416; color: #fff; text-align: center; padding: 10px; font-weight: 800; z-index: 40; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.flash { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--pc); color: #fff; font-family: var(--display); font-size: clamp(40px, 8vw, 72px); padding: 14px 40px; border-radius: 999px; z-index: 45; pointer-events: none; animation: flash 1.3s ease-out forwards; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.cf { position: fixed; width: 10px; height: 14px; border-radius: 2px; z-index: 44; pointer-events: none; animation: burst 1.4s cubic-bezier(.2,.7,.4,1) forwards; }

/* 애니메이션 */
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes dotb { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-6px); opacity: 1; } }
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
@keyframes glow { 0%,100% { box-shadow: 0 4px 12px rgba(120,70,20,.16); } 50% { box-shadow: 0 0 0 4px rgba(255,197,49,.45), 0 6px 16px rgba(120,70,20,.2); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes stamp { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes flash { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1); opacity: 0; } }
@keyframes burst { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), calc(var(--dy) + 220px)) rotate(var(--r)); opacity: 0; } }

/* ---------- 세로 화면 / 작은 화면 ---------- */
@media (max-aspect-ratio: 1/1) {
  .game { grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--topH) auto auto minmax(250px, 1fr); grid-template-areas: "top" "players" "board" "side"; }
  .side { flex-direction: row; min-height: 250px; }
  .board { gap: calc(var(--gap, 10px) * 2); }
  .side-a { flex: 1.15; min-width: 0; }
  .stack { flex: 1; min-height: 0; }
  .log { flex: .9; max-height: none; align-content: start; }
  .players { flex-wrap: wrap; }
  .pchip { flex-basis: calc(50% - 4px); max-width: none; }
  .lobby-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) and (min-aspect-ratio: 1/1) {
  .lobby-grid { grid-template-columns: 1fr 1fr; }
  .lobby-grid .lp-settings { grid-column: 1 / -1; }
  .brand span { display: none; }
}
@media (max-height: 640px) and (min-aspect-ratio: 1/1) {
  :root { --topH: 46px; }
  .pchip { padding: 3px 8px; } .pchip .av { width: 32px; height: 32px; }
  .pbar { display: none; }
  .log { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.file-note { background: #FFF2D6; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.5; text-align: left; }

</style>
</head>

function lettucePath(cx, cy, r, bumps, amp) {
  let d = '';
  const n = bumps * 2;
  for (let i = 0; i <= n * 4; i++) {
    const a = (i / (n * 4)) * Math.PI * 2;
    const rr = r + Math.sin(a * bumps) * amp;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return d + 'Z';
}

function burgerSVG(recipe, width) {
  const W = 100;
  const layers = recipe.map((k, i) => ({ k, top: i === 0, bottom: i === recipe.length - 1 }));
  const H = (l) => {
    const bread = l.k === 'sesame' || l.k === 'bun';
    if (bread) return l.top ? 22 : (l.bottom ? 12 : 10);
    return { beef: 11, chicken: 12, cheese: 6, tomato: 6, lettuce: 7 }[l.k];
  };
  const total = layers.reduce((s, l) => s + H(l), 0) + 4;
  let y = 2, out = '';
  layers.forEach(l => {
    const h = H(l), k = l.k;
    const bread = k === 'sesame' || k === 'bun';
    const fill = k === 'sesame' ? '#E9A453' : '#E08A3F';
    if (bread && l.top && recipe.length > 1) {
      out += `<path d="M12 ${y + h} Q12 ${y} 50 ${y} Q88 ${y} 88 ${y + h} Z" fill="${fill}"/>`;
      if (k === 'sesame') for (let i = 0; i < 6; i++) out += `<ellipse cx="${26 + i * 10}" cy="${y + 6 + (i % 2) * 5}" rx="1.4" ry="2.4" fill="#FFF3D6"/>`;
    } else if (bread) {
      out += `<rect x="12" y="${y}" width="76" height="${h}" rx="${Math.min(6, h / 2)}" fill="${fill}"/>`;
      if (k === 'sesame') for (let i = 0; i < 5; i++) out += `<ellipse cx="${24 + i * 13}" cy="${y + h / 2}" rx="1.3" ry="2" fill="#FFF3D6"/>`;
    } else if (k === 'beef') {
      out += `<rect x="9" y="${y}" width="82" height="${h}" rx="5" fill="#5C3524"/><g stroke="#2E190F" stroke-width="2">${[22, 38, 54, 70].map(x => `<line x1="${x}" y1="${y + 2}" x2="${x + 6}" y2="${y + h - 2}"/>`).join('')}</g>`;
    } else if (k === 'chicken') {
      out += `<rect x="9" y="${y}" width="82" height="${h}" rx="6" fill="#D9862A"/>` + [16, 30, 44, 58, 72, 84].map((x, i) => `<circle cx="${x}" cy="${y + (i % 2 ? 4 : h - 4)}" r="3.2" fill="#F2B04F"/>`).join('');
    } else if (k === 'cheese') {
      out += `<path d="M10 ${y} H90 V${y + h} H74 L70 ${y + h + 4} L66 ${y + h} H40 L36 ${y + h + 5} L32 ${y + h} H10Z" fill="#FFD23F"/>`;
    } else if (k === 'tomato') {
      out += `<rect x="14" y="${y}" width="32" height="${h}" rx="3" fill="#E2453A"/><rect x="54" y="${y}" width="32" height="${h}" rx="3" fill="#E2453A"/>`;
    } else if (k === 'lettuce') {
      let d = `M8 ${y + h}`;
      for (let x = 8; x <= 92; x += 7) d += ` Q${x + 3.5} ${y - 2} ${x + 7} ${y + h - 1}`;
      out += `<path d="${d} Z" fill="#6CBF4B"/>`;
    }
    y += h;
  });
  return `<svg viewBox="0 0 ${W} ${total}" width="${width || 100}" aria-hidden="true" preserveAspectRatio="xMidYMid meet">${out}</svg>`;
}

/* =========================================================
 * 게임 엔진 (방장 기기 / 혼자 연습 기기에서만 실행)
 * - secret: 타일 정답(비공개). pub: 모든 기기에 보내는 공개 상태.
 * ========================================================= */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const DEFAULT_SETTINGS = { tilesPer: 2, openCount: 3, target: 10, timeLimit: 0, bonus: true, revealSec: 3 };

class Engine {
  constructor(opts) {
    this.rng = opts.rng || Math.random;
    this.speed = opts.speed || 1;
    this.onChange = opts.onChange || (() => {});
    this.onEvent = opts.onEvent || (() => {});
    this.timer = null;
    this.secret = [];
    this.deck = [];
    this.pub = null;
    if (opts.snapshot) { this.restore(opts.snapshot); return; }
    const s = Object.assign({}, DEFAULT_SETTINGS, opts.settings || {});
    this.settings = s;
    const tiles = [];
    ING_KEYS.forEach(k => { for (let i = 0; i < s.tilesPer; i++) tiles.push(k); });
    this.secret = shuffle(tiles, this.rng);
    this.deck = shuffle(CARDS.map(c => c.id), this.rng);
    const open = [];
    for (let i = 0; i < s.openCount; i++) open.push(this.deck.pop());
    const first = opts.first == null || opts.first < 0
      ? Math.floor(this.rng() * opts.players.length) : opts.first;
    this.pub = {
      v: 0,
      phase: 'play',
      settings: s,
      players: opts.players.map(p => ({ id: p.id, name: p.name, color: p.color, isAI: !!p.isAI, level: p.level || null, hats: 0, cards: [], online: p.online !== false })),
      turn: first,
      round: 1,
      tiles: this.secret.map(() => ({ f: null, m: '' })),
      open,
      deck: this.deck.length,
      act: { k: 'idle' },
      bonus: false,
      log: [],
      endsAt: s.timeLimit ? Date.now() + s.timeLimit * 60000 : 0,
      result: null,
    };
    this.log(`${this.cur().name}부터 시작해요!`);
  }

  /* ---------- 공용 ---------- */
  cur() { return this.pub.players[this.pub.turn]; }
  card(id) { return CARDS[id]; }
  log(text, color) {
    this.pub.log.push({ t: text, c: color || null });
    if (this.pub.log.length > 8) this.pub.log.shift();
  }
  changed() { this.pub.v++; this.onChange(this.pub); }
  later(ms, fn) {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.timer = null; fn(); }, Math.max(0, ms / this.speed));
  }
  destroy() { clearTimeout(this.timer); this.timer = null; this.onChange = () => {}; this.onEvent = () => {}; }
  revealMs() { return Math.round((this.pub.settings.revealSec || 3) * 1000); }
  publicState() { return Object.assign({}, this.pub, { now: Date.now() }); }

  snapshot() {
    return JSON.parse(JSON.stringify({ secret: this.secret, deck: this.deck, pub: this.pub, settings: this.settings }));
  }
  restore(snap) {
    this.secret = snap.secret; this.deck = snap.deck; this.pub = snap.pub; this.settings = snap.settings || snap.pub.settings;
  }
  /* 저장된 상태에서 이어하기: 진행 중이던 연출(확인/실패/성공)을 바로 마무리 */
  resumePending() {
    const k = this.pub.act.k;
    if (k === 'peek') this.finishPeek();
    else if (k === 'fail') this.finishFail();
    else if (k === 'win') this.finishWin();
    else this.changed();
  }

  setOnline(pid, online) {
    const p = this.pub.players.find(x => x.id === pid);
    if (!p || p.online === online) return;
    p.online = online;
    this.changed();
  }

  /* ---------- 행동 처리 ---------- */
  act(pid, a) {
    const P = this.pub;
    if (P.phase !== 'play' || !a) return false;
    const idx = P.players.findIndex(p => p.id === pid);
    if (idx < 0 || idx !== P.turn) return false;
    switch (a.type) {
      case 'peek': return this.peek(a.tile);
      case 'challenge': return this.challenge(a.slot);
      case 'pick': return this.pick(a.tile);
      case 'pass': return this.pass();
      default: return false;
    }
  }

  isDown(t) { return Number.isInteger(t) && t >= 0 && t < this.secret.length && this.pub.tiles[t].f === null; }

  peek(t) {
    const P = this.pub;
    if (P.act.k !== 'idle' || P.bonus || !this.isDown(t)) return false;
    const ing = this.secret[t];
    P.tiles[t] = { f: ing, m: 'peek' };
    P.act = { k: 'peek', tile: t, ms: this.revealMs() };
    this.log(`${this.cur().name}: 재료 확인 → ${ING[ing].ko}`, this.cur().color);
    this.onEvent({ type: 'reveal', tile: t, ing, by: this.cur().id });
    this.changed();
    this.later(P.act.ms, () => this.finishPeek());
    return true;
  }
  finishPeek() {
    const P = this.pub;
    if (P.act.k !== 'peek') return;
    const t = P.act.tile;
    P.tiles[t] = { f: null, m: '' };
    this.onEvent({ type: 'hide', tiles: [t] });
    this.nextTurn();
  }

  challenge(slot) {
    const P = this.pub;
    if (P.act.k !== 'idle' || !Number.isInteger(slot) || P.open[slot] == null) return false;
    const card = this.card(P.open[slot]);
    P.act = { k: 'chal', slot, card: card.id, step: 0, picks: [] };
    this.log(`${this.cur().name}: 도전! ${card.name}`, this.cur().color);
    this.onEvent({ type: 'challenge', card: card.id, by: this.cur().id });
    this.changed();
    return true;
  }

  pick(t) {
    const P = this.pub, A = P.act;
    if (A.k !== 'chal' || !this.isDown(t)) return false;
    const card = this.card(A.card);
    const need = card.order[A.step];
    const ing = this.secret[t];
    this.onEvent({ type: 'reveal', tile: t, ing, by: this.cur().id });
    if (ing === need) {
      P.tiles[t] = { f: ing, m: 'ok' };
      A.picks.push(t);
      A.step++;
      if (A.step >= card.order.length) return this.win();
      this.changed();
      return true;
    }
    P.tiles[t] = { f: ing, m: 'bad' };
    P.act = { k: 'fail', slot: A.slot, card: A.card, picks: A.picks.slice(), wrong: t, need, ms: Math.max(2200, this.revealMs()) };
    this.log(`${this.cur().name}: ${card.name} 실패 (${ING[need].ko} 자리에 ${ING[ing].ko})`, '#B23A2E');
    this.onEvent({ type: 'fail', by: this.cur().id });
    this.changed();
    this.later(P.act.ms, () => this.finishFail());
    return true;
  }
  finishFail() {
    const P = this.pub, A = P.act;
    if (A.k !== 'fail') return;
    const hide = A.picks.concat([A.wrong]);
    hide.forEach(t => { P.tiles[t] = { f: null, m: '' }; });
    this.onEvent({ type: 'hide', tiles: hide });
    this.nextTurn();
  }

  win() {
    const P = this.pub, A = P.act;
    const card = this.card(A.card);
    const me = this.cur();
    me.cards.push(card.id);
    me.hats += card.hats;
    P.act = { k: 'win', slot: A.slot, card: A.card, picks: A.picks.slice(), gain: card.hats, ms: 2000 };
    this.log(`${me.name}: ${card.name} 완성! 모자 +${card.hats}`, '#1E8E4E');
    this.onEvent({ type: 'win', by: me.id, card: card.id });
    this.changed();
    this.later(P.act.ms, () => this.finishWin());
    return true;
  }
  finishWin() {
    const P = this.pub, A = P.act;
    if (A.k !== 'win') return;
    A.picks.forEach(t => { P.tiles[t] = { f: null, m: '' }; });
    this.onEvent({ type: 'hide', tiles: A.picks });
    P.open[A.slot] = this.deck.length ? this.deck.pop() : null;
    P.deck = this.deck.length;
    const me = this.cur();
    if (me.hats >= P.settings.target) return this.over('target');
    if (P.open.every(c => c == null)) return this.over('deck');
    if (P.settings.bonus && !P.bonus) {
      P.bonus = true;
      P.act = { k: 'idle' };
      this.log(`${me.name}: 한 번 더 도전할 수 있어요`, me.color);
      this.changed();
      return;
    }
    this.nextTurn();
  }

  pass() {
    const P = this.pub;
    if (P.act.k !== 'idle' || !P.bonus) return false;
    this.log(`${this.cur().name}: 차례 마침`, this.cur().color);
    this.nextTurn();
    return true;
  }

  /* 방장 전용: 연결이 끊긴 사람의 차례 건너뛰기 */
  skip() {
    const P = this.pub, A = P.act;
    if (P.phase !== 'play') return false;
    if (A.k === 'chal') {
      A.picks.forEach(t => { P.tiles[t] = { f: null, m: '' }; });
      this.onEvent({ type: 'hide', tiles: A.picks });
    } else if (A.k !== 'idle') return false;
    this.log(`${this.cur().name}님의 차례를 건너뛰었어요`);
    this.nextTurn();
    return true;
  }

  nextTurn() {
    const P = this.pub;
    clearTimeout(this.timer); this.timer = null;
    P.bonus = false;
    P.act = { k: 'idle' };
    if (P.endsAt && Date.now() >= P.endsAt) return this.over('time');
    const n = P.players.length;
    for (let k = 1; k <= n; k++) {
      const j = (P.turn + k) % n;
      if (P.players[j].online !== false) { P.turn = j; break; }
    }
    P.round++;
    this.onEvent({ type: 'turn', turn: P.turn, id: this.cur().id });
    this.changed();
  }

  over(reason) {
    const P = this.pub;
    clearTimeout(this.timer); this.timer = null;
    P.phase = 'over';
    P.act = { k: 'idle' };
    P.bonus = false;
    const sorted = P.players.map((p, i) => ({ id: p.id, name: p.name, color: p.color, hats: p.hats, cards: p.cards.length, i }))
      .sort((a, b) => b.hats - a.hats || b.cards - a.cards || a.i - b.i);
    let rank = 0, prev = null;
    sorted.forEach((r, k) => {
      if (!prev || prev.hats !== r.hats || prev.cards !== r.cards) rank = k + 1;
      r.rank = rank; prev = r;
    });
    P.result = { reason, ranking: sorted };
    const msg = { target: `${sorted[0].name} 모자 ${P.settings.target}개 달성!`, deck: '버거 카드를 모두 만들었어요!', time: '제한 시간이 끝났어요!' }[reason];
    this.log(msg, '#1E8E4E');
    this.onEvent({ type: 'over', reason });
    this.changed();
  }
}


/* =========================================================
 * 컴퓨터 상대 — 사람처럼 "기억"하고 가끔 잊거나 헷갈린다
 * ========================================================= */

const AI_LEVELS = {
  easy:   { ko: '쉬움',   base: 0.80, decay: 0.09, floor: 0.30, wrong: 0.12, maxLen: 6, gamble: 0.10, think: [1300, 1900], step: [900, 1200] },
  normal: { ko: '보통',   base: 0.93, decay: 0.045, floor: 0.50, wrong: 0.04, maxLen: 6, gamble: 0.03, think: [1000, 1500], step: [750, 1000] },
  hard:   { ko: '어려움', base: 0.995, decay: 0.004, floor: 0.95, wrong: 0.0, maxLen: 6, gamble: 0.0, think: [800, 1200], step: [600, 850] },
};
const AI_NAMES = { easy: '꼬마 셰프봇', normal: '셰프봇', hard: '마스터 셰프봇' };

class AIBrain {
  constructor(id, level, rng) {
    this.id = id;
    this.level = AI_LEVELS[level] ? level : 'normal';
    this.L = AI_LEVELS[this.level];
    this.rng = rng || Math.random;
    this.mem = new Map();   // tile -> { ing, round }
    this.belief = null;     // 이번 차례에 떠올린 기억
    this.plan = null;       // 도전할 때 고를 타일 순서
  }

  observe(ev, pub) {
    if (ev.type === 'reveal') this.mem.set(ev.tile, { ing: ev.ing, round: pub.round });
    if (ev.type === 'turn') { this.belief = null; this.plan = null; }
  }

  recallAll(pub) {
    const b = new Map();
    for (const [t, m] of this.mem) {
      const age = Math.max(0, pub.round - m.round);
      const p = Math.max(this.L.floor, this.L.base - this.L.decay * age);
      if (this.rng() < p) {
        let ing = m.ing;
        if (this.rng() < this.L.wrong) {
          const others = ING_KEYS.filter(k => k !== ing);
          ing = others[Math.floor(this.rng() * others.length)];
        }
        b.set(t, ing);
      }
    }
    return b;
  }

  /* 기억만으로 완성할 수 있는 카드와 타일 순서 */
  findPlan(pub, belief, allowMissing) {
    let best = null;
    pub.open.forEach((cid, slot) => {
      if (cid == null) return;
      const card = CARDS[cid];
      if (card.order.length > this.L.maxLen) return;
      const used = new Set();
      const tiles = [];
      let missing = 0;
      for (const need of card.order) {
        let found = null;
        for (const [t, ing] of belief) {
          if (ing === need && !used.has(t) && pub.tiles[t].f === null) { found = t; break; }
        }
        if (found == null) { missing++; tiles.push(null); } else { used.add(found); tiles.push(found); }
      }
      if (missing > (allowMissing || 0)) return;
      const score = card.hats * 10 - missing * 15 - card.order.length;
      if (!best || score > best.score) best = { slot, tiles, score, missing };
    });
    return best;
  }

  decide(pub) {
    const A = pub.act;
    if (A.k === 'idle') {
      this.belief = this.recallAll(pub);
      let plan = this.findPlan(pub, this.belief, 0);
      if (!plan && this.rng() < this.L.gamble) plan = this.findPlan(pub, this.belief, 1);
      if (plan) { this.plan = plan.tiles; return { type: 'challenge', slot: plan.slot }; }
      if (pub.bonus) return { type: 'pass' };
      return { type: 'peek', tile: this.pickUnknown(pub) };
    }
    if (A.k === 'chal') {
      const card = CARDS[A.card];
      const need = card.order[A.step];
      if (!this.belief) this.belief = this.recallAll(pub);
      let t = this.plan && this.plan[A.step];
      if (t == null || pub.tiles[t].f !== null) {
        t = null;
        for (const [tt, ing] of this.belief) {
          if (ing === need && pub.tiles[tt].f === null) { t = tt; break; }
        }
      }
      if (t == null) t = this.pickUnknown(pub);
      return { type: 'pick', tile: t };
    }
    return null;
  }

  pickUnknown(pub) {
    const down = [];
    pub.tiles.forEach((x, i) => { if (x.f === null) down.push(i); });
    const known = this.belief || new Map();
    const unknown = down.filter(i => !known.has(i));
    const pool = unknown.length ? unknown : down;
    return pool[Math.floor(this.rng() * pool.length)];
  }
}

/* 엔진에 붙어서 컴퓨터 차례를 자동으로 진행 */
class AIDriver {
  constructor(engine, speed) {
    this.engine = engine;
    this.speed = speed || 1;
    this.brains = new Map();
    this.timer = null;
    this.key = '';
  }
  add(id, level) { this.brains.set(id, new AIBrain(id, level, this.engine.rng)); }
  onEvent(ev) { for (const b of this.brains.values()) b.observe(ev, this.engine.pub); }
  onChange(pub) {
    if (pub.phase !== 'play') { this.stop(); return; }
    const cur = pub.players[pub.turn];
    const brain = cur && this.brains.get(cur.id);
    const A = pub.act;
    if (!brain || (A.k !== 'idle' && A.k !== 'chal')) { this.stop(); return; }
    const key = `${pub.turn}|${A.k}|${A.step || 0}|${pub.bonus}|${pub.round}`;
    if (key === this.key && this.timer) return;
    this.stop();
    this.key = key;
    const range = A.k === 'idle' ? brain.L.think : brain.L.step;
    const delay = (range[0] + Math.random() * (range[1] - range[0])) / this.speed;
    this.timer = setTimeout(() => {
      this.timer = null;
      const P = this.engine.pub;
      if (P.phase !== 'play' || P.players[P.turn].id !== cur.id) return;
      const a = brain.decide(P);
      if (a && !this.engine.act(cur.id, a)) {
        // 혹시 판단이 어긋나면 안전하게 다른 행동
        const fb = P.act.k === 'chal' ? { type: 'pick', tile: brain.pickUnknown(P) } : (P.bonus ? { type: 'pass' } : { type: 'peek', tile: brain.pickUnknown(P) });
        this.engine.act(cur.id, fb);
      }
    }, delay);
  }
  stop() { clearTimeout(this.timer); this.timer = null; this.key = ''; }
}


/* =========================================================
 * 네트워크 — 방장 기기가 심판(호스트), 참가자는 방장에게 직접 연결
 *  - peer : PeerJS(WebRTC) — 실제 태블릿끼리 연결
 *  - local: BroadcastChannel — 같은 브라우저의 여러 창(테스트·시연용, ?net=local)
 * ========================================================= */

const NET_PREFIX = 'ssam-stackburger-v1-';
const NET_MODE = (new URLSearchParams(location.search).get('net') === 'local') ? 'local' : 'peer';
const HB_MS = 4000, DEAD_MS = 13000;

function netError(code, detail) { const e = new Error(code); e.code = code; e.detail = detail; return e; }

/* ---------- PeerJS ---------- */
class PeerHost {
  constructor(code, h) { this.code = code; this.h = h; this.conns = new Map(); this.closed = false; }
  start() {
    return new Promise((resolve, reject) => {
      if (typeof Peer === 'undefined') return reject(netError('nolib'));
      let opened = false;
      const t = setTimeout(() => { if (!opened) { reject(netError('timeout')); this.close(); } }, 15000);
      this.peer = new Peer(NET_PREFIX + this.code, { debug: 1 });
      this.peer.on('open', () => { opened = true; clearTimeout(t); resolve(this); });
      this.peer.on('connection', conn => this.attach(conn));
      this.peer.on('disconnected', () => {
        if (this.closed) return;
        this.h.onStatus && this.h.onStatus('reconnecting');
        setTimeout(() => { if (!this.closed && this.peer.disconnected) { try { this.peer.reconnect(); } catch (e) { } } }, 1500);
      });
      this.peer.on('open', () => this.h.onStatus && this.h.onStatus('ok'));
      this.peer.on('error', e => {
        if (!opened) { clearTimeout(t); reject(netError(e.type === 'unavailable-id' ? 'taken' : 'net', e.type)); this.close(); return; }
        if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') this.h.onStatus && this.h.onStatus('reconnecting');
      });
    });
  }
  attach(conn) {
    const id = conn.connectionId;
    conn.on('open', () => { this.conns.set(id, conn); });
    conn.on('data', d => { if (!this.conns.has(id)) this.conns.set(id, conn); this.h.onMsg(id, d); });
    const gone = () => { if (this.conns.delete(id)) this.h.onLeave(id); };
    conn.on('close', gone);
    conn.on('error', gone);
  }
  send(id, msg) { const c = this.conns.get(id); if (c && c.open) { try { c.send(msg); } catch (e) { } } }
  broadcast(msg) { for (const id of this.conns.keys()) this.send(id, msg); }
  drop(id) { const c = this.conns.get(id); if (c) { try { c.close(); } catch (e) { } } if (this.conns.delete(id)) this.h.onLeave(id); }
  close() { this.closed = true; for (const c of this.conns.values()) { try { c.close(); } catch (e) { } } this.conns.clear(); try { this.peer && this.peer.destroy(); } catch (e) { } }
}

class PeerClient {
  constructor(code, h) { this.code = code; this.h = h; this.closed = false; }
  start() {
    return new Promise((resolve, reject) => {
      if (typeof Peer === 'undefined') return reject(netError('nolib'));
      let done = false;
      const fail = (code, d) => { if (done) return; done = true; clearTimeout(t); reject(netError(code, d)); this.close(true); };
      const t = setTimeout(() => fail('timeout'), 15000);
      this.peer = new Peer({ debug: 1 });
      this.peer.on('error', e => {
        if (!done) fail(e.type === 'peer-unavailable' ? 'nohost' : 'net', e.type);
        else if (e.type === 'peer-unavailable' || e.type === 'network') this.lost();
      });
      this.peer.on('open', () => {
        const conn = this.peer.connect(NET_PREFIX + this.code, { reliable: true, serialization: 'json' });
        this.conn = conn;
        conn.on('open', () => { if (done) return; done = true; clearTimeout(t); resolve(this); });
        conn.on('data', d => this.h.onMsg(d));
        conn.on('close', () => this.lost());
        conn.on('error', () => this.lost());
      });
    });
  }
  lost() { if (this.closed) return; this.close(true); this.h.onClose && this.h.onClose(); }
  send(msg) { if (this.conn && this.conn.open) { try { this.conn.send(msg); } catch (e) { } } }
  close(silent) { this.closed = true; try { this.conn && this.conn.close(); } catch (e) { } try { this.peer && this.peer.destroy(); } catch (e) { } }
}

/* ---------- BroadcastChannel (같은 브라우저 창끼리) ---------- */
class LocalHost {
  constructor(code, h) { this.code = code; this.h = h; this.conns = new Set(); this.closed = false; }
  start() {
    return new Promise((resolve, reject) => {
      this.bc = new BroadcastChannel('sb-' + this.code);
      let taken = false;
      this.bc.onmessage = e => {
        const m = e.data || {};
        if (m.kind === 'here' && !this.ready) taken = true;
        if (!this.ready || m.to !== 'host') return;
        if (m.kind === 'probe') return this.bc.postMessage({ kind: 'here' });
        if (m.kind === 'open') { this.conns.add(m.from); this.bc.postMessage({ to: m.from, kind: 'ack' }); return; }
        if (m.kind === 'data') { if (!this.conns.has(m.from)) this.conns.add(m.from); this.h.onMsg(m.from, m.data); return; }
        if (m.kind === 'close') { if (this.conns.delete(m.from)) this.h.onLeave(m.from); }
      };
      this.bc.postMessage({ to: 'host', kind: 'probe' });
      setTimeout(() => {
        if (taken) { this.bc.close(); return reject(netError('taken')); }
        this.ready = true;
        this.unload = () => this.bc.postMessage({ to: '*', kind: 'bye' });
        window.addEventListener('pagehide', this.unload);
        resolve(this);
      }, 250);
    });
  }
  send(id, msg) { if (!this.closed) this.bc.postMessage({ to: id, kind: 'data', data: msg }); }
  broadcast(msg) { if (!this.closed) for (const id of this.conns) this.send(id, msg); }
  drop(id) { if (this.conns.delete(id)) { this.bc.postMessage({ to: id, kind: 'bye' }); this.h.onLeave(id); } }
  close() { if (this.closed) return; this.closed = true; try { this.bc.postMessage({ to: '*', kind: 'bye' }); this.bc.close(); } catch (e) { } window.removeEventListener('pagehide', this.unload); }
}

class LocalClient {
  constructor(code, h) { this.code = code; this.h = h; this.id = 'c' + Math.random().toString(36).slice(2, 10); this.closed = false; }
  start() {
    return new Promise((resolve, reject) => {
      this.bc = new BroadcastChannel('sb-' + this.code);
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; this.bc.close(); reject(netError('nohost')); } }, 1500);
      this.bc.onmessage = e => {
        const m = e.data || {};
        if (m.to !== this.id && m.to !== '*') return;
        if (m.kind === 'ack' && !done) { done = true; clearTimeout(t); resolve(this); return; }
        if (m.kind === 'data') this.h.onMsg(m.data);
        if (m.kind === 'bye') this.lost();
      };
      this.bc.postMessage({ to: 'host', from: this.id, kind: 'open' });
      this.unload = () => this.bc.postMessage({ to: 'host', from: this.id, kind: 'close' });
      window.addEventListener('pagehide', this.unload);
    });
  }
  lost() { if (this.closed) return; this.close(); this.h.onClose && this.h.onClose(); }
  send(msg) { if (!this.closed) this.bc.postMessage({ to: 'host', from: this.id, kind: 'data', data: msg }); }
  close() { if (this.closed) return; this.closed = true; try { this.bc.postMessage({ to: 'host', from: this.id, kind: 'close' }); this.bc.close(); } catch (e) { } window.removeEventListener('pagehide', this.unload); }
}

const Net = {
  mode: NET_MODE,
  host(code, h) { return (NET_MODE === 'local' ? new LocalHost(code, h) : new PeerHost(code, h)).start(); },
  join(code, h) { return (NET_MODE === 'local' ? new LocalClient(code, h) : new PeerClient(code, h)).start(); },
};


/* =========================================================
 * 세션 — 방장(HostSession) / 참가자(ClientSession) / 혼자 연습(HostSession solo)
 * ========================================================= */

const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};

function getPid() {
  if (NET_MODE === 'local') {
    // 로컬 시연 모드: 창마다 다른 사람으로 취급
    let q = null; try { q = sessionStorage.getItem('sb-pid'); } catch (e) { }
    if (!q) { q = 'w' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('sb-pid', q); } catch (e) { } }
    return q;
  }
  let p = Store.get('sb-pid');
  if (!p) { p = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); Store.set('sb-pid', p); }
  return p;
}
function newRoomCode() { return String(100000 + Math.floor(Math.random() * 900000)); }
function cleanName(n, fallback) { n = String(n || '').replace(/\s+/g, ' ').trim().slice(0, 8); return n || fallback || '플레이어'; }

class HostSession {
  constructor(opts) {
    this.role = opts.solo ? 'solo' : 'host';
    this.code = opts.code || null;
    this.me = opts.me;
    this.speed = opts.speed || 1;
    this.settings = Object.assign({}, DEFAULT_SETTINGS, opts.settings || {});
    this.first = opts.first || 'random';
    this.roster = opts.roster || [{ pid: opts.me.pid, name: opts.me.name, color: PLAYER_COLORS[0], isAI: false, online: true, host: true }];
    this.conn2pid = new Map(); this.pid2conn = new Map();
    this.spectators = new Set(); this.lastSeen = new Map();
    this.engine = null; this.ai = null; this.phase = 'lobby';
    this.netStatus = 'ok';
    this.listeners = new Set();
    this.saveTimer = null;
  }

  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }

  async open() {
    if (this.role === 'solo') return;
    let tries = 0;
    for (;;) {
      try {
        this.net = await Net.host(this.code, {
          onMsg: (id, m) => this.onMsg(id, m),
          onLeave: id => this.onLeave(id),
          onStatus: s => { this.netStatus = s; this.notify(); },
        });
        break;
      } catch (e) {
        tries++;
        if (e.code === 'taken' && this.resumed && tries < 8) { await new Promise(r => setTimeout(r, 2500)); continue; }
        if (e.code === 'taken' && !this.resumed && tries < 5) { this.code = newRoomCode(); continue; }
        throw e;
      }
    }
    this.hb = setInterval(() => this.heartbeat(), HB_MS);
  }

  /* ---------- 상태 ---------- */
  view() {
    if (this.engine) {
      return Object.assign(this.engine.publicState(), { room: this.code, hostPid: this.me.pid, watchers: this.spectators.size });
    }
    return {
      phase: 'lobby', room: this.code, hostPid: this.me.pid, settings: this.settings, watchers: this.spectators.size,
      players: this.roster.map(r => ({ id: r.pid, name: r.name, color: r.color, isAI: r.isAI, level: r.level || null, online: r.isAI || r.host || r.online, host: !!r.host })),
    };
  }
  notify() { const s = this.view(); this.listeners.forEach(fn => fn(s, this)); return s; }
  emit() {
    const s = this.notify();
    if (this.net) this.net.broadcast({ t: 'state', s });
    this.save();
  }
  save() {
    if (this.role === 'solo') return;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => {
      Store.set('sb-host', {
        code: this.code, savedAt: Date.now(), me: this.me, roster: this.roster, settings: this.settings,
        phase: this.engine ? this.engine.pub.phase : 'lobby', snap: this.engine ? this.engine.snapshot() : null,
      });
    }, 250);
  }

  /* ---------- 네트워크 ---------- */
  onMsg(id, m) {
    if (!m || typeof m !== 'object') return;
    this.lastSeen.set(id, Date.now());
    if (m.t === 'hello') return this.hello(id, m);
    if (m.t === 'act') {
      const pid = this.conn2pid.get(id);
      if (pid && this.engine && m.a) this.engine.act(pid, m.a);
      return;
    }
    if (m.t === 'bye') { this.net.drop(id); }
  }
  hello(id, m) {
    const send = msg => this.net.send(id, msg);
    if (m.spectate) {
      this.spectators.add(id);
      send({ t: 'welcome', role: 'spectator' });
      this.emit();
      return;
    }
    const pid = String(m.pid || '');
    if (!pid) return send({ t: 'reject', reason: 'bad' });
    const known = this.roster.find(r => r.pid === pid && !r.isAI);
    if (known) {
      if (known.host) return send({ t: 'reject', reason: 'same-device' });
      const old = this.pid2conn.get(pid);
      if (old && old !== id) { this.conn2pid.delete(old); }
      this.pid2conn.set(pid, id); this.conn2pid.set(id, pid);
      known.online = true;
      if (this.engine) this.engine.setOnline(pid, true);
      send({ t: 'welcome', role: 'player', pid });
      this.emit();
      return;
    }
    if (this.engine) return send({ t: 'reject', reason: 'started' });
    if (this.roster.length >= 4) return send({ t: 'reject', reason: 'full' });
    let name = cleanName(m.name, '친구');
    const names = new Set(this.roster.map(r => r.name));
    if (names.has(name)) { let k = 2; while (names.has(name.slice(0, 7) + k)) k++; name = name.slice(0, 7) + k; }
    const used = new Set(this.roster.map(r => r.color));
    const color = PLAYER_COLORS.find(c => !used.has(c)) || PLAYER_COLORS[0];
    this.roster.push({ pid, name, color, isAI: false, online: true });
    this.pid2conn.set(pid, id); this.conn2pid.set(id, pid);
    send({ t: 'welcome', role: 'player', pid });
    this.emit();
  }
  onLeave(id) {
    this.lastSeen.delete(id);
    if (this.spectators.delete(id)) { this.emit(); return; }
    const pid = this.conn2pid.get(id);
    this.conn2pid.delete(id);
    if (!pid || this.pid2conn.get(pid) !== id) return;
    this.pid2conn.delete(pid);
    const r = this.roster.find(x => x.pid === pid);
    if (!r) return;
    if (!this.engine) this.roster = this.roster.filter(x => x.pid !== pid);
    else { r.online = false; this.engine.setOnline(pid, false); }
    this.emit();
  }
  heartbeat() {
    if (!this.net) return;
    this.net.broadcast({ t: 'hb' });
    const now = Date.now();
    for (const [id, t] of this.lastSeen) if (now - t > DEAD_MS) { this.lastSeen.delete(id); this.net.drop(id); }
  }

  /* ---------- 대기실 ---------- */
  addAI(level) {
    if (this.engine || this.roster.length >= 4) return;
    const base = AI_NAMES[level] || '셰프봇';
    const names = new Set(this.roster.map(r => r.name));
    let name = base, k = 2;
    while (names.has(name)) name = base + (k++);
    const used = new Set(this.roster.map(r => r.color));
    this.roster.push({ pid: 'ai-' + Math.random().toString(36).slice(2, 8), name, color: PLAYER_COLORS.find(c => !used.has(c)), isAI: true, level, online: true });
    this.emit();
  }
  removePlayer(pid) {
    const r = this.roster.find(x => x.pid === pid);
    if (!r || r.host || this.engine) return;
    const conn = this.pid2conn.get(pid);
    this.roster = this.roster.filter(x => x.pid !== pid);
    if (conn && this.net) { this.net.send(conn, { t: 'reject', reason: 'kicked' }); this.pid2conn.delete(pid); this.conn2pid.delete(conn); setTimeout(() => this.net && this.net.drop(conn), 300); }
    this.emit();
  }
  setSettings(patch) { if (this.engine) return; Object.assign(this.settings, patch); this.emit(); }

  /* ---------- 게임 ---------- */
  start() {
    if (this.roster.length < 2) return false;
    this.startEngine();
    return true;
  }
  startEngine(snapshot) {
    if (this.engine) this.engine.destroy();
    if (this.ai) this.ai.stop();
    const players = this.roster.map(r => ({ id: r.pid, name: r.name, color: r.color, isAI: r.isAI, level: r.level, online: !!(r.isAI || r.host || r.online) }));
    let first = -1;
    if (this.first === 'me') first = 0;
    else if (this.first === 'ai') first = Math.max(0, players.findIndex(p => p.isAI));
    else {
      const on = players.map((p, i) => p.online ? i : -1).filter(i => i >= 0);
      first = on[Math.floor(Math.random() * on.length)];
    }
    this.engine = new Engine({
      players, settings: this.settings, first, speed: this.speed, snapshot,
      onChange: () => this.onEngineChange(), onEvent: ev => this.ai && this.ai.onEvent(ev),
    });
    if (snapshot) {
      this.engine.pub.players.forEach(p => {
        const r = this.roster.find(x => x.pid === p.id);
        p.online = !!(r && (r.isAI || r.host));
      });
    }
    this.ai = new AIDriver(this.engine, this.speed);
    this.roster.filter(r => r.isAI).forEach(r => this.ai.add(r.pid, r.level));
    this.phase = 'play';
    if (snapshot) this.engine.resumePending();
    else this.onEngineChange();
  }
  onEngineChange() {
    this.phase = this.engine.pub.phase;
    this.emit();
    if (this.ai) this.ai.onChange(this.engine.pub);
  }
  act(a) { return this.engine ? this.engine.act(this.me.pid, a) : false; }
  skip() { return this.engine ? this.engine.skip() : false; }
  restart() {
    if (!this.engine) return;
    this.roster.forEach(r => { if (!r.isAI && !r.host) r.online = this.pid2conn.has(r.pid); });
    this.startEngine();
  }
  close() {
    clearInterval(this.hb); clearTimeout(this.saveTimer);
    if (this.ai) this.ai.stop();
    if (this.engine) this.engine.destroy();
    if (this.net) { this.net.broadcast({ t: 'reject', reason: 'closed' }); const n = this.net; setTimeout(() => n.close(), 200); }
    this.net = null; this.listeners.clear();
    if (this.role === 'host') Store.del('sb-host');
  }

  static async resume(saved, speed) {
    const s = new HostSession({ code: saved.code, me: saved.me, settings: saved.settings, roster: saved.roster, speed });
    s.roster.forEach(r => { if (!r.isAI && !r.host) r.online = false; });
    s.resumed = true;
    await s.open();
    if (saved.snap) s.startEngine(saved.snap); else s.emit();
    return s;
  }
}

class ClientSession {
  constructor(opts) {
    this.role = opts.spectate ? 'spectator' : 'client';
    this.code = opts.code;
    this.me = opts.me;
    this.state = null;
    this.status = 'connecting';
    this.reason = null;
    this.closed = false;
    this.listeners = new Set();
    this.attempts = 0;
  }
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  notify() { this.listeners.forEach(fn => fn(this.state, this)); }

  async connect() {
    this.net = await Net.join(this.code, { onMsg: m => this.onMsg(m), onClose: () => this.onClose() });
    this.lastHost = Date.now();
    this.net.send({ t: 'hello', pid: this.me.pid, name: this.me.name, spectate: this.role === 'spectator' });
    clearInterval(this.hb);
    this.hb = setInterval(() => {
      if (!this.net || this.closed) return;
      this.net.send({ t: 'hb' });
      if (Date.now() - this.lastHost > DEAD_MS) { const n = this.net; this.net = null; n.close(); this.onClose(); }
    }, HB_MS);
    Store.set('sb-join', { code: this.code, name: this.me.name, spectate: this.role === 'spectator', savedAt: Date.now() });
  }
  onMsg(m) {
    if (!m || typeof m !== 'object') return;
    this.lastHost = Date.now();
    if (m.t === 'welcome') { this.status = 'ok'; this.attempts = 0; this.notify(); return; }
    if (m.t === 'reject') {
      this.status = 'rejected'; this.reason = m.reason; this.closed = true;
      clearInterval(this.hb); try { this.net && this.net.close(); } catch (e) { }
      Store.del('sb-join');
      this.notify(); return;
    }
    if (m.t === 'state') { this.state = m.s; this.status = 'ok'; this.notify(); }
  }
  onClose() {
    if (this.closed) return;
    this.net = null;
    this.status = 'reconnecting';
    this.notify();
    clearTimeout(this.rt);
    this.rt = setTimeout(() => this.retry(), 2500);
  }
  async retry() {
    if (this.closed) return;
    this.attempts++;
    if (this.attempts > 48) { this.status = 'lost'; this.notify(); return; }
    try { await this.connect(); }
    catch (e) { this.rt = setTimeout(() => this.retry(), 2500); }
  }
  manualRetry() { this.closed = false; this.attempts = 0; this.status = 'reconnecting'; this.notify(); this.retry(); }
  act(a) { if (this.net && this.role === 'client') this.net.send({ t: 'act', a }); }
  close() {
    this.closed = true;
    clearInterval(this.hb); clearTimeout(this.rt);
    if (this.net) { this.net.send({ t: 'bye' }); const n = this.net; setTimeout(() => n.close(), 150); }
    this.net = null; this.listeners.clear();
    Store.del('sb-join');
  }
}

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const QS = new URLSearchParams(location.search);

/* ---------------- 소리 ---------------- */
const Sound = {
  ctx: null, on: Store.get('sb-sound', true),
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  tone(f, d, type, vol, at) {
    if (!this.on || !this.ctx) return;
    const t0 = this.ctx.currentTime + (at || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(this.ctx.destination); o.start(t0); o.stop(t0 + d + 0.02);
  },
  flip() { this.tone(520, 0.08, 'triangle', 0.12); this.tone(780, 0.07, 'triangle', 0.08, 0.05); },
  ok() { this.tone(660, 0.12, 'sine', 0.16); this.tone(990, 0.14, 'sine', 0.12, 0.08); },
  bad() { this.tone(220, 0.28, 'sawtooth', 0.08); this.tone(165, 0.32, 'sawtooth', 0.07, 0.12); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.14, i * 0.09)); },
  turn() { this.tone(880, 0.12, 'sine', 0.1); this.tone(1175, 0.16, 'sine', 0.08, 0.1); },
  end() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.12, i * 0.13)); },
};
document.addEventListener('pointerdown', () => Sound.unlock(), { capture: true });

const Wake = {
  lock: null, want: false,
  async on() { this.want = true; try { if ('wakeLock' in navigator && !this.lock) { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } } catch (e) { } },
  off() { this.want = false; try { this.lock && this.lock.release(); } catch (e) { } this.lock = null; },
};

function seg(name, options, cur, disabled) {

    `<button type="button" class="${String(v) === String(cur) ? 'on' : ''}" data-v="${v}" ${disabled ? 'disabled' : ''}>${l}</button>`).join('')}</div>`;
}
function segVal(root, name) {

}
function wireSegs(root, onChange) {
  $$('.seg', root).forEach(sg => sg.addEventListener('click', e => {

let modalEl = null;
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
function openModal(html, handlers, opts) {
  closeModal();
  modalEl = document.createElement('div');
  modalEl.className = 'modal-back' + (opts && opts.cls ? ' ' + opts.cls : '');
  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (b) { const fn = handlers && handlers[b.dataset.m]; if (fn) fn(e, b); else if (b.dataset.m === 'close') closeModal(); return; }
    if (e.target === modalEl && !(opts && opts.sticky)) closeModal();
  });
  const first = $('input', modalEl); if (first) setTimeout(() => first.focus(), 50);
  return modalEl;
}

function toast(msg, ms) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }

}

}

  /* ---------- 혼자 연습 ---------- */

          <div class="field"><span>재료타일</span>${seg('tilesPer', [[2, '14장 초급'], [3, '21장 중급'], [4, '28장 고급']], last.tilesPer || 2)}</div>

          <div class="field"><span>확인 시간</span>${seg('revealSec', [[2, '2초'], [3, '3초'], [5, '5초']], last.revealSec || 3)}</div>
          <div class="field"><span>먼저 하기</span>${seg('first', [['me', '나'], ['ai', '컴퓨터'], ['random', '무작위']], last.first || 'me')}</div>
          <button class="btn primary wide" data-a="start">시작하기</button>
        </div>
      </div>`;

        const r = this.root;
        const opt = { level: segVal(r, 'level'), tilesPer: +segVal(r, 'tilesPer'), target: +segVal(r, 'target'), revealSec: +segVal(r, 'revealSec'), first: segVal(r, 'first') };

  startSolo(name, opt) {

  /* ---------- 방 만들기 ---------- */
  askCreate() {
    const name = Store.get('sb-name', '');
    openModal(`<h3>방 만들기</h3><p class="muted">내 태블릿이 방장(심판)이 돼요. 게임이 끝날 때까지 이 화면을 닫지 마세요.</p>
      <label class="field"><span>내 이름</span><input id="host-name" maxlength="8" value="${esc(name)}" placeholder="이름 (8자까지)" autocomplete="off"></label>
      <div class="m-btns"><button class="btn" data-m="close">취소</button><button class="btn primary" data-m="go">방 만들기</button></div>`, {
      go: () => {
        const nm = cleanName($('#host-name').value, '방장'); Store.set('sb-name', nm);
        closeModal(); this.createRoom(nm);
      },
    });
    $('#host-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-m="go"]').click(); });
  },
  async createRoom(name) {
    this.showBusy('방을 만드는 중…');
    const s = new HostSession({ code: newRoomCode(), me: { pid: this.pid, name }, speed: SPEED });
    try {
      await s.open();
    } catch (e) {
      s.close();
      this.showHome();
      return this.netFail(e);
    }
    this.setSession(s);
    s.emit();
  },
  async resumeHost() {
    const saved = Store.get('sb-host');
    if (!saved) return;
    this.showBusy(`방 ${saved.code}을 다시 여는 중…`);
    try {
      const s = await HostSession.resume(saved, SPEED);
      this.setSession(s);
      this.screen = '';
      s.emit();
      toast('방을 다시 열었어요. 친구들이 자동으로 다시 연결돼요.', 3500);

    }

  netFail(e) {
    const why = e && e.code === 'nolib' ? '연결 기능을 불러오지 못했어요.' : '인터넷 연결 서버에 접속하지 못했어요.';

  /* ---------- 참여 ---------- */
  showJoin(code) {
    this.screen = 'join';
    const name = Store.get('sb-name', '');
    this.root.innerHTML = `
      <div class="screen setup">
        <div class="setup-card">
          <button class="back" data-a="home">← 처음으로</button>

          <label class="check"><input type="checkbox" id="j-spec"> 관전만 하기 (교사용 큰 화면·TV)</label>
          <p class="err" id="j-err"></p>
          <button class="btn primary wide" data-a="go">입장하기</button>
        </div>
      </div>`;
    const ci = $('#j-code');
    ci.addEventListener('input', () => { ci.value = ci.value.replace(/\D/g, '').slice(0, 6); });
    (code ? $('#j-name') : ci).focus();
    const go = () => {
      const c = ci.value.replace(/\D/g, '');
      if (c.length !== 6) { $('#j-err').textContent = '방 번호 6자리를 입력해 주세요.'; return; }
      const nm = cleanName($('#j-name').value, '');
      const spec = $('#j-spec').checked;
      if (!nm && !spec) { $('#j-err').textContent = '이름을 입력해 주세요.'; return; }
      if (nm) Store.set('sb-name', nm);
      this.doJoin(c, nm || '관전', spec);
    };
    $('#j-name').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    this.root.onclick = e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'home') { history.replaceState(null, '', location.pathname + (Net.mode === 'local' ? '?net=local' : '')); this.showHome(); }
      if (b.dataset.a === 'go') go();
    };
  },
  async doJoin(code, name, spectate) {
    this.showBusy(`방 ${code}에 들어가는 중…`);
    const s = new ClientSession({ code, me: { pid: this.pid, name }, spectate });
    this.setSession(s);
    try {
      await s.connect();
    } catch (e) {
      this.setSession(null);
      this.showJoin(code);
      const msg = e.code === 'nohost' ? '방을 찾을 수 없어요. 방 번호를 확인하거나, 방장 화면이 켜져 있는지 확인해 주세요.'
        : e.code === 'timeout' ? '연결 시간이 초과되었어요. 다시 시도해 주세요.' : '인터넷 연결 서버에 접속하지 못했어요. 네트워크를 확인해 주세요.';
      $('#j-err').textContent = msg;
    }
  },

  showBusy(msg) {
    this.screen = 'busy'; closeModal();
    this.root.onclick = null;
    this.root.innerHTML = `<div class="screen busy"><div class="spinner">${logoSVG(96)}</div><p>${esc(msg)}</p></div>`;
  },
  showConnecting(s) {
    if (this.screen === 'game' || this.screen === 'lobby') return;
    this.showBusy('방장과 연결하는 중…');
  },
};
